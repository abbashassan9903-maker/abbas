  total += pen(R.consec * 1.5, `${R.consec} حالة تجاوز للحد الأقصى للحصص المتتالية`, R.consec);
  total += pen(R.holes * 0.8, `${R.holes} فراغ داخل جداول الشعب`, R.holes);
  total += pen(R.repeats * 1.5, `${R.repeats} تكرار للمادة في اليوم أكثر من المناسب`, R.repeats);
  total += pen(R.prefs * 0.7, `${R.prefs} مخالفة لتفضيلات المعلمين`, R.prefs);
  total += pen(R.unplaced * 4, `${R.unplaced} حصة غير موزعة`, R.unplaced);
  total += pen((R.conflicts.length + R.hard.length) * 8, `${R.conflicts.length + R.hard.length} تعارض أو مخالفة قيد`, R.conflicts.length + R.hard.length);
  total += pen((R.sdFirst + R.sdLast) * 2, 'عدم تساوٍ في توزيع الحصص الأولى والأخيرة بين المعلمين', R.sdFirst + R.sdLast > 0.8 ? 1 : 0);
  total += pen(R.sdLoad * 6, 'فروقات في نسب استكمال النصاب بين المعلمين', R.sdLoad > 0.15 ? 1 : 0);
  const score = Math.round(100 * (1 - Math.min(1, total / (0.5 * n))));
  return { score: S.lessons.length ? score : 0, reasons: reasons.sort((a, b) => b.pts - a.pts) };
}

/* ---------- التوليد ---------- */
function generate(opts = {}) {
  reindex();
  const t0 = performance.now(), budget = opts.ms || 3500;
  const all = S.lessons;
  const fixed = all.filter(l => l.day != null && isLocked(l));
  const fixedSet = new Set(fixed);
  const mov = all.filter(l => !fixedSet.has(l));
  const sm = new Map();
  all.forEach(l => {
    const set = new Set();
    for (let d = 0; d < nd(); d++) for (let p = 1; p <= np(); p++) if (!staticReason(l, d, p)) set.add(d * 10 + p);
    sm.set(l.id, set);
  });
  const tload = {}, tslots = {};
  all.forEach(l => { if (l.teacherId) tload[l.teacherId] = (tload[l.teacherId] || 0) + 1; });
  S.teachers.forEach(t => { let n = 0; for (let d = 0; d < nd(); d++) for (let p = 1; p <= np(); p++) if (teacherOK(t, d, p)) n++; tslots[t.id] = n || 1; });
  const diff = l => (sm.get(l.id).size || 0.5) / (1 + 3 * (l.teacherId ? (tload[l.teacherId] || 0) / tslots[l.teacherId] : 0));

  function attempt() {
    const o = mkOcc();
    mov.forEach(l => { l.day = null; l.period = null; });
    fixed.forEach(l => put(o, l, l.day, l.period));
    const order = mov.map(l => [diff(l) * (0.8 + Math.random() * 0.4), l]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    const un = [];
    for (const l of order) if (!placeBest(o, l, sm)) un.push(l);
    for (let r = 0; r < 3 && un.length; r++) for (let i = un.length - 1; i >= 0; i--) if (eject(o, un[i], sm, fixedSet)) un.splice(i, 1);
    return { un: un.length, cost: analyze().cost, snap: mov.map(l => [l, l.day, l.period]) };
  }

  let best = null, attempts = 0;
  while (attempts < 120 && performance.now() - t0 < budget * 0.5) {
    attempts++;
    const r = attempt();
    if (!best || r.un < best.un || (r.un === best.un && r.cost < best.cost)) best = r;
    if (best.un === 0 && attempts >= 6) break;
  }
  best.snap.forEach(([l, d, p]) => { l.day = d; l.period = p; });
  if (best.un > 0) {
    /* إصلاح بالحد الأدنى من التعارضات (min-conflicts مع قائمة حظر مؤقتة) */
    const ro = rebuildOcc(), tabu = new Map();
    for (let it = 1; it < 6000 && performance.now() - t0 < budget * 0.8; it++) {
      const left = mov.filter(l => l.day == null); if (!left.length) break;
      const l = left[rnd(left.length)];
      if (placeBest(ro, l, sm)) continue;
      const a = getA(l.asgId), c = getC(l.classId);
      let bestSlot = null, bestBl = null, bestN = Infinity;
      for (const code of sm.get(l.id)) {
        const d = Math.floor(code / 10), p = code % 10;
        const bl = new Set([ro.cl.get(kC(l.classId, d, p)), l.teacherId && ro.te.get(kC(l.teacherId, d, p))].filter(Boolean));
        let cnt = ro.cs.get(kS(l.classId, l.subjectId, d)) || 0;
        bl.forEach(b => { if (b.classId === l.classId && b.subjectId === l.subjectId && b.day === d) cnt--; });
        if (c.noRepeat !== false && cnt >= maxPerDay(a)) {
          let extra = null;
          for (let q = 1; q <= np() && !extra; q++) { const x = ro.cl.get(kC(l.classId, d, q)); if (x && x.subjectId === l.subjectId && !bl.has(x)) extra = x; }
          if (!extra) continue; bl.add(extra);
        }
        if ([...bl].some(b => fixedSet.has(b) || (tabu.get(b) || 0) > it)) continue;
        const n = bl.size + Math.random() * 0.9;
        if (n < bestN) { bestN = n; bestSlot = [d, p]; bestBl = [...bl]; }
      }
      if (!bestSlot) continue;
      bestBl.forEach(b => take(ro, b));
      put(ro, l, bestSlot[0], bestSlot[1]);
      bestBl.forEach(b => { tabu.set(b, it + 10); placeBest(ro, b, sm); });
    }
  }

  /* تحسين محلي: نقل أو تبديل داخل الشعبة الواحدة */
  const o = rebuildOcc();
  const pool = mov.filter(l => l.day != null);
  let cur = analyze().cost, it = 0, improved = 0;
  const revert = (a, b, ad, ap, d, p) => { take(o, a); if (b) take(o, b); put(o, a, ad, ap); if (b) put(o, b, d, p); };
  while (pool.length && it < 40000 && performance.now() - t0 < budget) {
    it++;
    const a = pool[rnd(pool.length)]; const c = getC(a.classId);
    const d = rnd(nd()), p = 1 + rnd(clsPeriods(c));
    if (a.day === d && a.period === p) continue;
    const b = o.cl.get(kC(a.classId, d, p));
    if (b && fixedSet.has(b)) continue;
    const ad = a.day, ap = a.period;
    take(o, a); if (b) take(o, b);
    let ok = isFree(o, a, d, p, sm);
    if (ok) { put(o, a, d, p); if (b) { ok = isFree(o, b, ad, ap, sm); if (ok) put(o, b, ad, ap); else take(o, a); } }
    if (!ok) { put(o, a, ad, ap); if (b) put(o, b, d, p); continue; }
    const nc = analyze().cost;
    if (nc <= cur) { if (nc < cur) improved++; cur = nc; } else revert(a, b, ad, ap, d, p);
  }
  const R = analyze();
  return { unplaced: R.unplaced, attempts, iterations: it, improved, report: R, ms: Math.round(performance.now() - t0) };
}

function clearUnlocked() {
  S.lessons.forEach(l => { if (!isLocked(l)) { l.day = null; l.period = null; } });
}

/* ---------- التشخيص ---------- */
function allowedSlotsForTeacher(t) {
  let n = 0; for (let d = 0; d < nd(); d++) for (let p = 1; p <= np(); p++) if (teacherOK(t, d, p)) n++; return n;
}
function classSlots(c) { return clsPeriods(c) * (nd() - (c.offDays || []).length) - (c.noLast ? (nd() - (c.offDays || []).length) : 0); }
function classRequired(c) { return S.assign.filter(a => a.classId === c.id).reduce((s, a) => s + a.count, 0); }

function unplacedReport() {
  const out = [];
  const byAsg = {};
  S.lessons.filter(l => l.day == null).forEach(l => { (byAsg[l.asgId] = byAsg[l.asgId] || []).push(l); });
  for (const aid in byAsg) {
    const ls = byAsg[aid], a = getA(aid), c = getC(a.classId), s = getSub(a.subjectId), t = getT(a.teacherId);
    const cnt = { off: 0, forb: 0, busyC: 0, busyT: 0, rep: 0 };
    const sample = ls[0];
    for (let d = 0; d < nd(); d++) for (let p = 1; p <= np(); p++) {
      const why = staticReason(sample, d, p);
      if (why) { if (/المعلم|راحة/.test(why)) cnt.off++; else cnt.forb++; continue; }
      if (S.lessons.some(x => x.day === d && x.period === p && x.classId === c.id && x !== sample)) cnt.busyC++;
      else if (t && S.lessons.some(x => x.day === d && x.period === p && x.teacherId === t.id)) cnt.busyT++;
      else cnt.rep++;
    }
    const why = [];
    if (!t) why.push('لم يُحدد معلم للمادة');
    if (cnt.off) why.push(`${cnt.off} فترة غير متاحة للمعلم ${t ? t.name : ''}`);
    if (cnt.forb) why.push(`${cnt.forb} فترة ممنوعة بقيود المادة/الشعبة`);
    if (cnt.busyT) why.push(`${cnt.busyT} فترة مشغولة للمعلم بحصص أخرى`);
    if (cnt.busyC) why.push(`${cnt.busyC} فترة مشغولة للشعبة`);
    if (cnt.rep) why.push(`${cnt.rep} فترة محجوبة بحد تكرار المادة في اليوم`);
    out.push({ a, c, s, t, n: ls.length, why });
  }
  return out;
}

function preCheck() {
  const issues = [];
  for (const c of S.classes) {
    const req = classRequired(c), av = classSlots(c);
    if (req > av) issues.push(`${c.name} يحتاج إلى ${req} حصة بينما المتاح ${av} فترة فقط.`);
  }
  for (const t of S.teachers) {
    const st = teacherStats(t), av = allowedSlotsForTeacher(t);
    if (st.load > av) issues.push(`المعلم ${t.name} يحتاج إلى ${st.load} حصة بينما المتاح له ${av} فترة فقط.`);
    else if (st.load > av * 0.9 && st.load > 0) issues.push(`المعلم ${t.name} أوقاته المتاحة (${av}) تكاد لا تكفي لحصصه (${st.load}).`);
    if (t.offDays && t.offDays.length) {
      const free = nd() - t.offDays.length; if (free <= 0) issues.push(`المعلم ${t.name} مغلقة جميع أيامه.`);
    }
  }
  for (const a of S.assign) {
    if (!a.count) continue;
    const l = S.lessons.find(x => x.asgId === a.id); if (!l) continue;
    let n = 0; for (let d = 0; d < nd(); d++) for (let p = 1; p <= np(); p++) if (!staticReason(l, d, p)) n++;
    const c = getC(a.classId), s = getSub(a.subjectId);
    if (n < a.count) issues.push(`مادة ${s.name} للصف ${c.name} تحتاج ${a.count} حصة بينما الفترات المسموحة لها ${n} فقط (راجع قيودها أو قيود المعلم).`);
  }
  return issues;
}

const FAIL_SOLUTIONS = ['زيادة يوم عمل للمعلم المعني', 'إلغاء يوم الراحة أو فترة عدم التوفر', 'تخفيف قيد المادة أو الشعبة',
  'تغيير معلم المادة إلى معلم آخر', 'زيادة عدد الحصص اليومية في إعدادات المدرسة', 'تعديل عدد الحصص الأسبوعية للمادة'];

/* ---------- الفحص الشامل ---------- */
function validate() {
  const R = analyze(); const critical = [], warnings = [];
  const C = (msg, fix) => critical.push({ msg, fix });
  const W = (msg, fix) => warnings.push({ msg, fix });
  const day = d => DAYS_ALL[d];
  for (const a of S.assign) {
    const c = getC(a.classId), s = getSub(a.subjectId), t = getT(a.teacherId);
    if (!t) C(`مادة ${s.name} للصف ${c.name} بدون معلم.`, 'اختر معلماً للمادة من صفحة «توزيع المواد».');
    else if (!specMatches(t, s)) W(`اختصاص المعلم ${t.name} (${t.specialty}) لا يطابق مادة ${s.name} في ${c.name}.`, 'غيّر المعلم أو اترك الاختيار إن كان مقصوداً.');
    const n = S.lessons.filter(l => l.asgId === a.id).length;
    if (n !== a.count) C(`عدد حصص ${s.name} في ${c.name} (${n}) لا يطابق المطلوب (${a.count}).`, 'أعد ضبط عدد الحصص من صفحة توزيع المواد.');
  }
  for (const c of S.classes) {
    const req = classRequired(c), av = classSlots(c);
    if (req > av) C(`${c.name}: عدد الحصص المطلوبة ${req} بينما الفترات المتاحة ${av} حصة.`, 'زد عدد الحصص اليومية للشعبة أو خفّض حصص بعض المواد.');
    else if (req < av) W(`${c.name}: عدد الحصص المطلوبة ${req} بينما الفترات المتاحة ${av}؛ ستبقى ${av - req} فترة فارغة.`, 'قلّل عدد الحصص اليومية للشعبة أو أضف مادة.');
  }
  if (R.unplaced) C(`${R.unplaced} حصة غير موزعة في الجدول.`, 'اضغط «توليد الجدول تلقائياً» أو ضع الحصص يدوياً من جدول الشعبة.');
  R.conflicts.forEach(x => {
    const l = x.a; const who = x.type === 'teacher' ? `المعلم ${getT(l.teacherId).name}` : `الشعبة ${getC(l.classId).name}`;
    C(`تعارض: ${who} لديه حصتان في الوقت نفسه (${day(l.day)} – الحصة ${l.period}).`, 'انقل إحدى الحصتين إلى وقت آخر.');
  });
  R.hard.forEach(x => C(`${getSub(x.l.subjectId).name} – ${getC(x.l.classId).name} (${day(x.l.day)} – ${x.l.period}): ${x.why}.`, 'انقل الحصة إلى فترة مسموحة أو عدّل القيد.'));
  for (const t of S.teachers) {
    const m = R.tm[t.id], st = teacherStats(t);
    if (m.consec) W(`المعلم ${t.name}: حصص متتالية تتجاوز ${t.maxConsec || S.settings.maxConsec} (${m.consec} مرة).`, 'وزّع حصصه على فترات متباعدة أو ارفع الحد الأقصى.');
    if (m.gaps > 2) W(`المعلم ${t.name}: ${m.gaps} فراغات بين الحصص.`, 'أعد التوليد أو قرّب حصصه يدوياً.');
    if (st.load > t.quota) W(`المعلم ${t.name}: حصصه (${st.load}) تتجاوز النصاب (${t.quota}).`, 'انقل مادة إلى معلم آخر.');
    if (st.load >= 6 && m.days > 0 && m.days <= 1) W(`المعلم ${t.name}: كل حصصه (${st.load}) في يوم عمل واحد.`, 'وزّعها على أيام أكثر.');
    if (st.load > 0 && st.load <= nd() && m.days === nd()) W(`المعلم ${t.name}: يداوم ${m.days} أيام لتدريس ${st.load} حصص فقط.`, 'ركّز حصصه في أيام أقل إن أمكن.');
  }
  for (const c of S.classes) { const m = R.cm[c.id]; if (m.holes > 2) W(`${c.name}: ${m.holes} فراغ داخل الجدول بين الحصص.`, 'أعد التوليد أو اسحب الحصص لسد الفراغات.'); }
  R.repeatList.forEach(x => W(`${x.c.name}: تكرار ${getSub(x.a.subjectId).name} أكثر من المناسب يوم ${day(x.d)}.`, 'انقل إحدى الحصص ليوم آخر.'));
  if (R.sdFirst > 1.2) W('توزيع الحصص الأولى غير متساوٍ بين المعلمين.', 'أعد التوليد لتحسين العدالة.');
  return { critical, warnings, R, quality: qualityScore(R) };
}

/* ---------- البدلاء ---------- */
function suggestSubs(lesson, absentId) {
  const d = lesson.day, p = lesson.period, sub = getSub(lesson.subjectId);
  const out = [];
  for (const t of S.teachers) {
    if (t.id === absentId) continue;
    if (!teacherOK(t, d, p)) continue;
    if (S.lessons.some(l => l.teacherId === t.id && l.day === d && l.period === p)) continue;
    const dayLoad = S.lessons.filter(l => l.teacherId === t.id && l.day === d).length;
    const st = teacherStats(t);
    const match = specMatches(t, sub);
    const score = (match ? 0 : 6) + dayLoad * 1.5 + (st.load >= t.quota ? 4 : st.load / Math.max(1, t.quota));
    out.push({ t, score, match, dayLoad, load: st.load });
  }
  return out.sort((a, b) => a.score - b.score);
}

function dateToDay(str) { const g = new Date(str + 'T12:00:00').getDay(); return g < nd() ? g : -1; }
function datesBetween(a, b) {
  const out = []; let d = new Date(a + 'T12:00:00'); const e = new Date((b || a) + 'T12:00:00');
  while (d <= e && out.length < 120) { out.push(d.toISOString().slice(0, 10)); d = new Date(d.getTime() + 864e5); }
  return out;
}

</script>
<script>
'use strict';
/* =====================================================================
   grids.js — جداول العرض والتقارير (ترجع HTML نصاً فقط)
   ===================================================================== */

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
function hexA(hex, a) {
  const h = (hex || '#888888').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
const shortName = n => { const p = String(n || '').trim().split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[1] : p[0] || ''; };

function lessonMap(fn) {
  const m = new Map();
  for (const l of S.lessons) { if (l.day == null || !fn(l)) continue; const k = l.day * 10 + l.period; if (!m.has(k)) m.set(k, []); m.get(k).push(l); }
  return m;
}

function headCells() {
  const times = periodTimes();
  return range(1, np()).map(p => `<th>${p}<small>${times[p - 1][0]}</small></th>`).join('');
}

function lessonCell(l, mode, inter, sel, A) {
  const s = getSub(l.subjectId), t = getT(l.teacherId), c = getC(l.classId);
  const sub = mode === 'class' ? (t ? esc(t.name) : '<i>بدون معلم</i>') : mode === 'teacher' ? esc(c.name) : esc(t ? shortName(t.name) : '—');
  const lock = isLocked(l) ? '<b class="lk" title="مثبتة">🔒</b>' : '';
  const bad = A && A.conflictLessons.has(l.id) ? ' bad' : '';
  const picked = sel === l.id ? ' picked' : '';
  const drag = inter && !isLocked(l) ? ' draggable="true"' : '';
  return `<div class="les${bad}${picked}" data-lid="${l.id}" data-act="cell"${drag} style="background:${hexA(s.color, .2)};border-inline-start-color:${s.color}">${lock}<strong>${esc(s.name)}</strong><small>${sub}</small></div>`;
}

function cellTd(arr, d, p, mode, inter, sel, A, blocked) {
  const attrs = `data-d="${d}" data-p="${p}"`;
  if (!arr || !arr.length) return `<td class="empty${blocked ? ' off' : ''}" ${attrs} data-act="cell" title="${blocked ? 'غير متاح' : 'فارغ'}"></td>`;
  return `<td ${attrs} data-act="cellTd">${arr.map(l => lessonCell(l, mode, inter, sel, A)).join('')}</td>`;
}

function classGrid(c, inter = true, sel = null) {
  const A = analyze(); const m = lessonMap(l => l.classId === c.id); const cp = clsPeriods(c);
  let h = `<table class="tt"><thead><tr><th>اليوم</th>${headCells()}</tr></thead><tbody>`;
  for (let d = 0; d < nd(); d++) {
    h += `<tr><th>${DAYS_ALL[d]}</th>`;
    for (let p = 1; p <= np(); p++) {
      if (p > cp || clsDayOff(c, d) || (c.noLast && p === cp)) h += '<td class="na">—</td>';
      else h += cellTd(m.get(d * 10 + p), d, p, 'class', inter, sel, A, false);
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

function teacherGrid(t, inter = true, sel = null) {
  const A = analyze(); const m = lessonMap(l => l.teacherId === t.id);
  let h = `<table class="tt"><thead><tr><th>اليوم</th>${headCells()}</tr></thead><tbody>`;
  for (let d = 0; d < nd(); d++) {
    h += `<tr><th>${DAYS_ALL[d]}${(t.offDays || []).includes(d) ? '<small>راحة</small>' : ''}</th>`;
    for (let p = 1; p <= np(); p++) {
      const off = !teacherOK(t, d, p);
      const arr = m.get(d * 10 + p);
      if (off && !arr) h += '<td class="na" title="غير متاح">✕</td>';
      else h += cellTd(arr, d, p, 'teacher', inter, sel, A, off);
    }
    h += '</tr>';
  }
  return h + '</tbody></table>';
}

/* خلية الجدول العام لشعبة في يوم وحصة */
function genCell(c, d, p, m, q) {
  const edge = p === 1 ? ' ds' : '';
  const ls = (m.get(d * 10 + p) || []).filter(l => l.classId === c.id);
  if (!ls.length) return `<td class="${p > clsPeriods(c) ? 'na' : 'empty'}${edge}">${p > clsPeriods(c) ? '—' : ''}</td>`;
  const l = ls[0], s = getSub(l.subjectId), t = getT(l.teacherId);
  const hit = q && (s.name.includes(q) || (t && t.name.includes(q)) || c.name.includes(q));
  return `<td style="background:${hexA(s.color, .22)}" class="${hit ? 'hit' : ''}${edge}"><div class="gl"><strong>${esc(s.name)}</strong><small>${esc(t ? shortName(t.name) : '—')}</small></div></td>`;
}

/* الجدول العام: كل الأيام مع كل الصفوف في جدول واحد (صفوف = الشعب، أعمدة = الأيام × الحصص) */
function generalAll(filter = {}) {
  const q = (filter.q || '').trim();
  const classes = S.classes.filter(c => (!filter.grade || c.grade === +filter.grade));
  const m = lessonMap(l => (!filter.teacher || l.teacherId === filter.teacher));
  const days = range(0, nd() - 1);
  let h = `<table class="tt gen all"><thead><tr><th rowspan="2" class="cn">الشعبة</th>${days.map(d => `<th colspan="${np()}" class="dh">${DAYS_ALL[d]}</th>`).join('')}</tr>
    <tr>${days.map(() => range(1, np()).map(p => `<th class="ph${p === 1 ? ' ds' : ''}">${p}</th>`).join('')).join('')}</tr></thead><tbody>`;
  for (const c of classes) {
    h += `<tr><th class="cn">${esc(c.name)}</th>${days.map(d => range(1, np()).map(p => genCell(c, d, p, m, q)).join('')).join('')}</tr>`;
  }
  return h + '</tbody></table>';
}

/* الجدول العام ليوم واحد */
function generalDay(d, filter = {}) {
  const q = (filter.q || '').trim();
  const classes = S.classes.filter(c => (!filter.grade || c.grade === +filter.grade));
  const m = lessonMap(l => (!filter.teacher || l.teacherId === filter.teacher));
  let h = `<table class="tt gen"><thead><tr><th>${DAYS_ALL[d]}</th>${headCells()}</tr></thead><tbody>`;
  for (const c of classes) h += `<tr><th>${esc(c.name)}</th>${range(1, np()).map(p => genCell(c, d, p, m, q).replace(' ds"', '"')).join('')}</tr>`;
  return h + '</tbody></table>';
}

/* ---------- التقارير ---------- */
function reportHead(title) {
  const sc = S.school;
  return `<header class="rh">
    <div class="rh-logo">${sc.logo ? `<img src="${sc.logo}" alt="">` : '<span>🏫</span>'}</div>
    <div class="rh-mid"><h2>${esc(sc.name)}</h2><p>${esc([sc.directorate, sc.section, sc.governorate].filter(Boolean).join(' – '))}</p>
    <h3>${esc(title)}</h3><p>العام الدراسي ${esc(sc.year)} – ${esc(sc.stage)}</p></div>
    <div class="rh-date">${new Date().toLocaleDateString('ar-IQ-u-nu-latn')}</div></header>`;
}
function reportFoot() {
  const sc = S.school;
  return `<footer class="rf"><span>${esc(sc.author)}</span><span>مدير ${esc(sc.name)} – ${esc(sc.section)}</span></footer>`;
}
const sheet = (title, body) => `<section class="sheet">${reportHead(title)}${body}${reportFoot()}</section>`;
const tbl = (head, rows) => `<table class="dt"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}" class="muted">لا توجد بيانات</td></tr>`}</tbody></table>`;

const REPORTS = [
  { id: 'full', name: 'التقرير الشامل', fn() {
    const V = validate(); const A = V.R;
    const st = [['عدد الصفوف', new Set(S.classes.map(c => c.grade)).size], ['عدد الشعب', S.classes.length], ['عدد المعلمين', S.teachers.length],
      ['عدد المواد', S.subjects.length], ['إجمالي الحصص الأسبوعية', S.lessons.length], ['الحصص الموزعة', S.lessons.length - A.unplaced],
      ['الحصص غير الموزعة', A.unplaced], ['التعارضات', A.conflicts.length + A.hard.length], ['جودة الجدول', V.quality.score + '/100']];
    return sheet('التقرير الشامل', tbl(['البند', 'القيمة'], st) + '<h4>أنصبة المعلمين</h4>' + quotaTable() +
      '<h4>ملاحظات الفحص</h4>' + tbl(['النوع', 'الملاحظة'], [...V.critical.map(x => ['حرج', esc(x.msg)]), ...V.warnings.slice(0, 40).map(x => ['تحذير', esc(x.msg)])]));
  } },
  { id: 'classes', name: 'جدول كل شعبة', fn: () => S.classes.map(c => sheet('جدول شعبة ' + c.name, classGrid(c, false) + legend())).join('') },
  { id: 'teachers', name: 'جدول كل معلم', fn: () => S.teachers.map(t => sheet('جدول المعلم ' + t.name, teacherGrid(t, false) + teacherSummary(t))).join('') || sheet('جدول كل معلم', '<p class="muted">لا يوجد معلمون.</p>') },
  { id: 'general', name: 'الجدول العام', fn: () => sheet('الجدول العام لجميع الأيام والصفوف', generalAll() + legend() + '<p class="muted noprint">يُنصح بالطباعة على ورق A3 أفقي.</p>') },
  { id: 'quota', name: 'تقرير أنصبة المعلمين', fn: () => sheet('تقرير أنصبة المعلمين', quotaTable()) },
  { id: 'unplaced', name: 'الحصص غير الموزعة', fn() {
    const rows = unplacedReport().map(u => [esc(u.c.name), esc(u.s.name), esc(u.t ? u.t.name : '—'), u.n, esc(u.why.join('، '))]);
    return sheet('تقرير الحصص غير الموزعة', tbl(['الشعبة', 'المادة', 'المعلم', 'العدد', 'الأسباب'], rows));
  } },
  { id: 'conflicts', name: 'تقرير التعارضات', fn() {
    const V = validate();
    return sheet('تقرير التعارضات', tbl(['المشكلة', 'الحل المقترح'], V.critical.map(x => [esc(x.msg), esc(x.fix)])));
  } },
  { id: 'constraints', name: 'تقرير القيود', fn() {
    const rows = [];
    S.teachers.forEach(t => {
      (t.offDays || []).forEach(d => rows.push(['معلم', esc(t.name), 'إلزامي', 'يوم راحة: ' + DAYS_ALL[d]]));
      Object.entries(t.unavail || {}).forEach(([d, ps]) => { if (ps.length && !(t.offDays || []).includes(+d)) rows.push(['معلم', esc(t.name), 'إلزامي', `غير متاح ${DAYS_ALL[d]}: الحصص ${ps.join('، ')}`]); });
      if (t.noFirst) rows.push(['معلم', esc(t.name), 'إلزامي', 'لا يعمل الحصة الأولى']);
      if (t.noLast) rows.push(['معلم', esc(t.name), 'إلزامي', 'لا يعمل الحصة الأخيرة']);
      if (t.avoidFirst) rows.push(['معلم', esc(t.name), 'تفضيل', 'يفضل عدم الحصة الأولى']);
      if (t.avoidLast) rows.push(['معلم', esc(t.name), 'تفضيل', 'يفضل عدم الحصة الأخيرة']);
      if (t.noConsec) rows.push(['معلم', esc(t.name), 'تفضيل', 'يفضل عدم الحصص المتتالية']);
      if (t.spread) rows.push(['معلم', esc(t.name), 'تفضيل', 'يفضل توزيع الحصص على أيام متعددة']);
      if (t.prefOff != null) rows.push(['معلم', esc(t.name), 'تفضيل', 'يفضل راحة يوم ' + DAYS_ALL[t.prefOff]]);
    });
    S.subjects.forEach(s => {
      if (s.noLastN) rows.push(['مادة', esc(s.name), 'إلزامي', `لا توضع في آخر ${s.noLastN} حصة`]);
      if ((s.forbidP || []).length) rows.push(['مادة', esc(s.name), 'إلزامي', 'ممنوعة في الحصص: ' + s.forbidP.join('، ')]);
    });
    S.classes.forEach(c => {
      if (c.noLast) rows.push(['شعبة', esc(c.name), 'إلزامي', 'الحصة الأخيرة غير مسموحة']);
      (c.offDays || []).forEach(d => rows.push(['شعبة', esc(c.name), 'إلزامي', 'لا دوام يوم ' + DAYS_ALL[d]]));
      (c.forbid || []).forEach(f => rows.push(['شعبة', esc(c.name), 'إلزامي', `${esc((getSub(f.subjectId) || {}).name)} ممنوعة في الحصة ${f.period}`]));
    });
    S.lessons.filter(isLocked).forEach(l => rows.push(['حصة مثبتة', esc(getC(l.classId).name), 'ثابت', `${esc(getSub(l.subjectId).name)} – ${DAYS_ALL[l.day]} – الحصة ${l.period}`]));
    return sheet('تقرير القيود', tbl(['النوع', 'الجهة', 'الصنف', 'التفصيل'], rows));
  } },
  { id: 'absence', name: 'الغياب والبدلاء', fn() {
    const rows = [];
    S.absences.forEach(ab => {
      const t = getT(ab.teacherId); if (!t) return;
      absenceLessons(ab).forEach(x => {
        const sub = getT(ab.subs[x.date + '|' + x.l.id]);
        rows.push([x.date, esc(t.name), DAYS_ALL[x.l.day], x.l.period, esc(getC(x.l.classId).name), esc(getSub(x.l.subjectId).name), esc(sub ? sub.name : 'لم يُحدد')]);
      });
    });
    return sheet('تقرير الغياب والبدلاء', tbl(['التاريخ', 'المعلم الغائب', 'اليوم', 'الحصة', 'الشعبة', 'المادة', 'البديل'], rows));
  } },
  { id: 'subjects', name: 'المواد والحصص', fn() {
    const rows = S.assign.map(a => { const c = getC(a.classId), s = getSub(a.subjectId), t = getT(a.teacherId); return [esc(c.name), esc(s.name), a.count, esc(t ? t.name : '—'), S.lessons.filter(l => l.asgId === a.id && l.day != null).length]; });
    return sheet('تقرير المواد والحصص', tbl(['الشعبة', 'المادة', 'الحصص الأسبوعية', 'المعلم', 'الموزعة'], rows));
  } },
  { id: 'workdays', name: 'توزيع أيام العمل', fn() {
    const A = analyze();
    const rows = S.teachers.map(t => { const m = A.tm[t.id]; return [esc(t.name), ...range(0, nd() - 1).map(d => (t.offDays || []).includes(d) ? 'راحة' : m.perDay[d]), m.days]; });
    return sheet('تقرير توزيع أيام العمل', tbl(['المعلم', ...range(0, nd() - 1).map(d => DAYS_ALL[d]), 'أيام العمل'], rows));
  } },
  { id: 'quality', name: 'جودة وعدالة الجدول', fn() {
    const V = validate(); const A = V.R;
    const rows = S.teachers.map(t => { const m = A.tm[t.id]; return [esc(t.name), m.load, m.days, m.first, m.last, m.gaps, m.consec]; });
    return sheet('تقرير جودة وعدالة الجدول', `<p class="big">جودة الجدول: <b>${V.quality.score}/100</b></p>` +
      tbl(['أسباب انخفاض الدرجة'], V.quality.reasons.map(r => [esc(r.txt)])) + '<h4>تفاصيل العدالة بين المعلمين</h4>' +
      tbl(['المعلم', 'الحصص', 'أيام العمل', 'الحصص الأولى', 'الحصص الأخيرة', 'الفراغات', 'تجاوز المتتالية'], rows));
  } }
];

function legend() {
  return `<div class="legend">${S.subjects.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function quotaTable() {
  const rows = S.teachers.map(t => { const st = teacherStats(t); return [esc(t.name), esc(t.specialty), t.quota, st.load, st.subjects, st.classes, (st.diff > 0 ? '+' : '') + st.diff, st.pct + '%']; });
  return tbl(['المعلم', 'الاختصاص', 'النصاب', 'الحصص', 'المواد', 'الشعب', 'الفرق', 'الاستكمال'], rows);
}
function teacherSummary(t) {
  const A = analyze(), m = A.tm[t.id], st = teacherStats(t);
  const off = range(0, nd() - 1).filter(d => !m.perDay[d]).map(d => DAYS_ALL[d]).join('، ') || '—';
  return `<p class="muted">إجمالي الحصص: ${st.load} – أيام العمل: ${m.days} – أيام الراحة: ${off} – الفراغات: ${m.gaps} – تجاوز المتتالية: ${m.consec}</p>`;
}

/* الحصص المتأثرة بغياب معلم */
function absenceLessons(ab) {
  const out = [];
  datesBetween(ab.from, ab.to).forEach(date => {
    const d = dateToDay(date); if (d < 0) return;
    S.lessons.filter(l => l.teacherId === ab.teacherId && l.day === d).sort((a, b) => a.period - b.period).forEach(l => out.push({ date, l }));
  });
  return out;
}

/* تصدير HTML ملائم لفتحه في Excel */
function excelHTML(inner) {
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"><style>table{direction:rtl;border-collapse:collapse}td,th{border:1px solid #999;padding:4px;text-align:center;font-family:Tahoma}h2,h3,h4{text-align:center}</style></head><body dir="rtl">${inner}</body></html>`;
}

</script>
<script>
'use strict';
/* =====================================================================
   ui-core.js — الهيكل العام للواجهة والتفاعل
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ACT = {}, CHG = {}, INP = {}, PAGES = {};
const UI = { page: 'dashboard', classId: null, teacherId: null, asgClass: null, sel: null, q: '', genDay: 'all', genGrade: '', genTeacher: '', fSpec: '', tq: '', tSort: 'name', repId: 'full', last: null, absId: null, cmpA: '', cmpB: '' };

const NAV = [
  ['dashboard', '📊', 'لوحة التحكم'], ['wizard', '🧭', 'الإعداد السريع'], ['school', '🏫', 'معلومات المدرسة'],
  ['classes', '🏷️', 'الصفوف والشعب'], ['subjects', '📚', 'المواد الدراسية'], ['assign', '🔗', 'توزيع المواد والمعلمين'],
  ['teachers', '👥', 'ملفات المعلمين'], ['gen', '⚙️', 'التوليد والفحص'], ['tclass', '🗓️', 'جدول الشعبة'],
  ['tteacher', '🧑‍🏫', 'جدول المعلم'], ['general', '🗺️', 'الجدول العام'], ['absence', '🩺', 'الغياب والبدلاء'],
  ['reports', '🖨️', 'التقارير'], ['versions', '💾', 'النسخ والاحتياط'], ['log', '📝', 'سجل التغييرات'], ['activation', '🔑', 'التفعيل']
];

/* ---------- أدوات ---------- */
function toast(msg, type = 'ok') {
  const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg;
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), type === 'err' ? 6000 : 3200);
}

function openModal(title, body, o = {}) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true"><header><h3>${title}</h3><button class="btn sm" data-act="closeModal" aria-label="إغلاق">✕</button></header>
    <div class="mb">${body}</div><footer>${o.onSave ? `<button class="btn pri" data-act="modalSave">${o.saveText || 'حفظ'}</button>` : ''}<button class="btn" data-act="closeModal">${o.onSave ? 'إلغاء' : 'إغلاق'}</button></footer></div>`;
  root.classList.add('on'); root._save = o.onSave || null;
  const f = $('input,select', root); if (f && o.focus !== false) f.focus();
}
function closeModal() { const r = $('#modalRoot'); r.classList.remove('on'); r.innerHTML = ''; r._save = null; }
ACT.closeModal = () => closeModal();
ACT.modalSave = async () => { const r = $('#modalRoot'); if (r._save) { const ok = await r._save($('.modal', r)); if (ok !== false) closeModal(); } };

function ask(msg, o = {}) {
  return new Promise(res => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:#0b1a2acc;z-index:200;display:flex;align-items:center;justify-content:center;padding:14px';
    d.innerHTML = `<div class="modal" style="width:min(460px,100%)"><div class="mb"><p style="margin:0;font-size:16px">${msg}</p></div><footer><button class="btn ${o.danger ? 'danger' : 'pri'}" id="ay">${o.yes || 'نعم'}</button><button class="btn" id="an">${o.no || 'إلغاء'}</button></footer></div>`;
    document.body.appendChild(d);
    const done = v => { d.remove(); res(v); };
    $('#ay', d).onclick = () => done(true); $('#an', d).onclick = () => done(false);
    $('#ay', d).focus();
  });
}

function formVals(root) {
  const o = {};
  $$('[name]', root).forEach(el => {
    if (el.type === 'checkbox') { if (el.dataset.multi) { (o[el.name] = o[el.name] || []); if (el.checked) o[el.name].push(el.value); } else o[el.name] = el.checked; }
    else o[el.name] = el.value;
  });
  return o;
}
const field = (label, inner, cls = '') => `<label class="f ${cls}">${label}${inner}</label>`;
const inp = (name, val = '', type = 'text', extra = '') => `<input type="${type}" name="${name}" value="${esc(val)}" ${extra}>`;
const selOpts = (arr, cur) => arr.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(cur) ? 'selected' : ''}>${esc(t)}</option>`).join('');
const periodChecks = (name, cur = [], max = np()) => range(1, max).map(p => `<label><input type="checkbox" data-multi="1" name="${name}" value="${p}" ${cur.includes(p) ? 'checked' : ''}>${p}</label>`).join('');

/* ---------- الحفظ وإعادة الرسم ---------- */
function commit(msg, o, n) {
  if (msg) logChange(msg, o, n);
  reindex(); REV++; save(); render();
}

function stats() {
  const A = analyze(); const V = qualityScore(A);
  const total = S.lessons.length, placed = total - A.unplaced;
  let cons = 0;
  S.teachers.forEach(t => { cons += (t.offDays || []).length + Object.values(t.unavail || {}).reduce((s, a) => s + a.length, 0) + (t.noFirst ? 1 : 0) + (t.noLast ? 1 : 0); });
  S.subjects.forEach(s => { cons += (s.noLastN ? 1 : 0) + (s.forbidP || []).length; });
  S.classes.forEach(c => { cons += (c.noLast ? 1 : 0) + (c.offDays || []).length + (c.forbid || []).length; });
  cons += S.lessons.filter(isLocked).length;
  return { A, q: V, total, placed, unplaced: A.unplaced, conflicts: A.conflicts.length + A.hard.length, pct: total ? Math.round(placed / total * 100) : 0, cons };
}

function render() {
  if (!S) return;
  licTick();
  const lst = licStatus();
  /* بعد انتهاء التجربة: صفحة التفعيل فقط. في التجربة: تُخفى صفحات معينة */
  if (lst.state === 'expired') UI.page = 'activation';
  if (lst.state === 'trial' && TRIAL_HIDDEN_PAGES.includes(UI.page)) UI.page = 'dashboard';
  const nav = $('#side nav');
  const items = NAV.filter(([id]) => lst.state === 'expired' ? id === 'activation' : !(lst.state === 'trial' && TRIAL_HIDDEN_PAGES.includes(id)));
  nav.innerHTML = items.map(([id, ic, t]) => `<button class="nav ${UI.page === id ? 'on' : ''}" data-act="go" data-p="${id}"><i>${ic}</i>${t}</button>`).join('');
  const st = stats(); UI.last = st;
  const cur = NAV.find(x => x[0] === UI.page);
  $('#top').innerHTML = `<button class="btn" id="menuBtn" data-act="menu" aria-label="القائمة">☰</button><h1>${cur ? cur[2] : ''}</h1>
    ${lst.state === 'trial' ? `<a href="#" class="chip warn" data-act="go" data-p="activation">تجريبي: باقي ${lst.left} يوماً</a>` : ''}
    <span class="chip ${st.q.score >= 80 ? 'ok' : st.q.score >= 55 ? 'warn' : 'err'}" title="مؤشر الجودة">الجودة ${st.q.score}/100</span>
    <span class="chip ${st.conflicts ? 'err' : 'ok'}">${st.conflicts ? st.conflicts + ' تعارض' : 'بلا تعارضات'}</span>
    <span class="chip">${st.pct}% مكتمل</span>
    ${S.locks.full ? '<span class="chip warn">🔒 الجدول مقفل</span>' : ''}`;
  const html = (PAGES[UI.page] || PAGES.dashboard)();
  $('#main').innerHTML = (UI.page === 'activation' ? '' : licenseNotice()) + html;
  applyLicenseUI();
  $('#side').classList.remove('open');
}

ACT.go = el => { UI.page = el.dataset.p; UI.sel = null; render(); window.scrollTo(0, 0); if (el.dataset.add) ACT.editTeacher({ dataset: {} }); };
ACT.menu = () => $('#side').classList.toggle('open');
function goPage(p) { UI.page = p; UI.sel = null; render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A') e.preventDefault();
  Promise.resolve(f(el, e)).catch(err => { console.error(err); toast('حدث خطأ: ' + err.message, 'err'); });
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) Promise.resolve(CHG[el.dataset.chg](el, e)).catch(err => { console.error(err); toast('حدث خطأ: ' + err.message, 'err'); }); });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) INP[el.dataset.inp](el, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').classList.contains('on')) closeModal(); });

/* ---------- سحب وإفلات ---------- */
let dragId = null;
document.addEventListener('dragstart', e => { const l = e.target.closest('[data-lid]'); if (!l) return; dragId = l.dataset.lid; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { if (dragId && e.target.closest('td[data-d]')) e.preventDefault(); });
document.addEventListener('drop', e => {
  const td = e.target.closest('td[data-d]'); if (!td || !dragId) return; e.preventDefault();
  const id = dragId; dragId = null; moveLesson(id, +td.dataset.d, +td.dataset.p);
});
document.addEventListener('dragend', () => { dragId = null; });

/* النقر على خلية: تحديد حصة أو نقل الحصة المحددة إلى الخلية */
ACT.cell = (el, e) => {
  const lid = el.dataset.lid; const td = el.closest('td[data-d]');
  if (lid && (!UI.sel || UI.sel === lid)) { UI.sel = UI.sel === lid ? null : lid; render(); return; }
  if (UI.sel) {
    let d, p;
    if (td) { d = +td.dataset.d; p = +td.dataset.p; } else return;
    const id = UI.sel; UI.sel = null; moveLesson(id, d, p); return;
  }
};
ACT.cellTd = () => { };
ACT.pick = el => { UI.sel = UI.sel === el.dataset.lid ? null : el.dataset.lid; render(); };

/* ---------- نقل/تبديل حصة مع فحص القيود ---------- */
async function moveLesson(lid, d, p) {
  const l = getL(lid); if (!l) return;
  if (S.locks.full) return toast('الجدول مقفل بالكامل. ألغِ القفل من صفحة التوليد.', 'warn');
  if (isLocked(l)) return toast('هذه الحصة مثبتة. ألغِ التثبيت أولاً.', 'warn');
  const c = getC(l.classId);
  const target = S.lessons.find(x => x !== l && x.classId === l.classId && x.day === d && x.period === p);
  if (target && isLocked(target)) return toast('الحصة الموجودة في الهدف مثبتة ولا يمكن تبديلها.', 'warn');
  const why = staticReason(l, d, p);
  if (why) return toast('لا يمكن النقل: ' + why, 'err');
  const od = l.day, op = l.period;
  if (target && od != null) { const w2 = staticReason(target, od, op); if (w2) return toast('لا يمكن التبديل: ' + w2 + ' للحصة الأخرى', 'err'); }
  const warns = [];
  const busyT = S.lessons.find(x => x !== l && x !== target && l.teacherId && x.teacherId === l.teacherId && x.day === d && x.period === p);
  if (busyT) warns.push(`المعلم ${esc(getT(l.teacherId).name)} لديه حصة أخرى (${esc(getC(busyT.classId).name)}) في الوقت نفسه.`);
  if (target && od != null && target.teacherId) {
    const b2 = S.lessons.find(x => x !== l && x !== target && x.teacherId === target.teacherId && x.day === od && x.period === op);
    if (b2) warns.push(`المعلم ${esc(getT(target.teacherId).name)} سيصبح لديه تعارض بعد التبديل.`);
  }
  if (warns.length && !(await ask('⚠️ تعارض محتمل:<br>' + warns.join('<br>') + '<br><br>هل تريد المتابعة؟', { yes: 'متابعة' }))) return;
  l.day = d; l.period = p;
  if (target) { target.day = od; target.period = op; }
  const s = getSub(l.subjectId);
  commit(`${target ? 'تبديل' : 'نقل'} حصة ${s.name} (${c.name}) إلى ${DAYS_ALL[d]} – الحصة ${p}`);
  const v = analyze();
  if (v.conflicts.length || v.hard.length) toast('تم النقل لكن يوجد تعارض — راجع صفحة الفحص', 'warn'); else toast('تم النقل وفُحصت التعارضات: لا مشاكل', 'ok');
}

/* شريط أدوات الحصة المحددة */
function selBar() {
  if (!UI.sel) return '';
  const l = getL(UI.sel); if (!l) return '';
  const s = getSub(l.subjectId), c = getC(l.classId);
  return `<div class="selbar noprint"><span>المحددة: <b>${esc(s.name)}</b> – ${esc(c.name)} ${l.day != null ? '(' + DAYS_ALL[l.day] + ' – ' + l.period + ')' : '(غير موزعة)'}. اضغط خلية لنقلها أو التبديل.</span>
    ${l.day != null ? `<button class="btn sm" data-act="lockLesson" data-lid="${l.id}">${l.locked ? '🔓 إلغاء التثبيت' : '🔒 تثبيت'}</button><button class="btn sm" data-act="unplace" data-lid="${l.id}">إزالة من الجدول</button>` : ''}
    <button class="btn sm" data-act="chTeacher" data-lid="${l.id}">تغيير معلم المادة</button><button class="btn sm" data-act="desel">إلغاء التحديد</button></div>`;
}
ACT.desel = () => { UI.sel = null; render(); };
ACT.lockLesson = el => { const l = getL(el.dataset.lid); l.locked = !l.locked; commit(`${l.locked ? 'تثبيت' : 'إلغاء تثبيت'} حصة ${getSub(l.subjectId).name} (${getC(l.classId).name})`); };
ACT.unplace = el => { const l = getL(el.dataset.lid); if (isLocked(l)) return toast('الحصة مثبتة', 'warn'); l.day = null; l.period = null; UI.sel = null; commit('إزالة حصة من الجدول'); };
ACT.chTeacher = el => {
  const l = getL(el.dataset.lid); const a = getA(l.asgId);
  openModal('تغيير معلم المادة', `<p>سيتغير المعلم لجميع حصص ${esc(getSub(a.subjectId).name)} في ${esc(getC(a.classId).name)}.</p>` + field('المعلم', `<select name="t">${teacherOptions(a)}</select>`), {
    onSave: m => { setTeacherByUI(a, formVals(m).t); }
  });
};

</script>
<script>
'use strict';
/* =====================================================================
   license.js — الفترة التجريبية وتفعيل البرنامج بكود
   • منفصل تماماً عن بيانات الجدول: انتهاء التجربة لا يحذف أي بيانات.
   • الكود مرتبط برقم الجهاز (يظهر للمستخدم) ويُولَّد من «مولد الأكواد».
   • تنبيه: التحقق يتم محلياً دون إنترنت، لذا هو حماية تجارية معقولة وليس حماية مطلقة.
   ===================================================================== */
const LIC_CFG = {
  K1: 'schoolTT.license.v1', K2: 'schoolTT.lic.bk',
  TRIAL_DAYS: 14,
  SECRET: '54480e3131fa1eb9ae88b5ff',
  ALPHA: 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
};
/* الصفحات المخفية في التجربة، والتقارير المتاحة فيها */
const TRIAL_HIDDEN_PAGES = ['absence', 'log'];
const TRIAL_REPORTS = ['classes', 'teachers', 'general', 'quota', 'unplaced', 'conflicts', 'subjects'];
let LIC = null;

function h53(str, seed = 0) {
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}
function toB32(x, n) { let o = ''; for (let i = 0; i < n; i++) { o += LIC_CFG.ALPHA[x % 32]; x = Math.floor(x / 32); } return o; }
function codeFor(dev) {
  const raw = toB32(h53(dev + '|' + LIC_CFG.SECRET, 7), 8) + toB32(h53(LIC_CFG.SECRET + '|' + dev, 13), 8);
  return raw.match(/.{4}/g).join('-');
}
const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').match(/.{1,4}/g)?.join('-') || '';
function newDeviceId() {
  let s = ''; for (let i = 0; i < 8; i++) s += LIC_CFG.ALPHA[Math.floor(Math.random() * 32)];
  return s.slice(0, 4) + '-' + s.slice(4);
}

function licSave() {
  try {
    const j = JSON.stringify(LIC);
    localStorage.setItem(LIC_CFG.K1, j); localStorage.setItem(LIC_CFG.K2, btoa(unescape(encodeURIComponent(j))));
  } catch (e) { /* لا شيء */ }
}
function licInit(hadData) {
  let rec = null;
  try { rec = JSON.parse(localStorage.getItem(LIC_CFG.K1) || 'null'); } catch (e) { /* تالف */ }
  if (!rec) { try { rec = JSON.parse(decodeURIComponent(escape(atob(localStorage.getItem(LIC_CFG.K2) || '')))); } catch (e) { rec = null; } }
  if (!rec || !rec.dev) {
    /* بيانات الجدول موجودة لكن سجل التجربة مفقود: يُعدّ ذلك تلاعباً وتُعتبر التجربة منتهية */
    rec = { dev: newDeviceId(), first: hadData ? 0 : Date.now(), last: Date.now(), active: false, code: '' };
  }
  LIC = rec; licSave();
}
function licStatus() {
  const now = Date.now(), r = LIC;
  if (r.active && r.code === codeFor(r.dev)) return { state: 'active' };
  const tamper = now < (r.last || 0) - 2 * 864e5;
  const left = r.first ? LIC_CFG.TRIAL_DAYS - Math.floor((now - r.first) / 864e5) : 0;
  if (tamper || left <= 0) return { state: 'expired', tamper };
  return { state: 'trial', left };
}
function licTick() { if (LIC && Date.now() > (LIC.last || 0)) { LIC.last = Date.now(); licSave(); } }
const isTrial = () => licStatus().state === 'trial';
const isExpired = () => licStatus().state === 'expired';
const isActive = () => licStatus().state === 'active';

function licActivate(code) {
  const c = normCode(code);
  if (c === codeFor(LIC.dev)) { LIC.active = true; LIC.code = c; licSave(); return true; }
  return false;
}

/* منع الميزات المخفية في التجربة */
function featureBlocked(name) {
  if (!isTrial()) return false;
  toast('هذه الميزة متاحة بعد تفعيل البرنامج', 'warn'); goPage('activation'); return true;
}

/* إخفاء عناصر الواجهة في التجربة */
function applyLicenseUI() {
  if (!isTrial()) return;
  const hide = ['[data-act=printNow]', '[data-act=exportPdf]', '[data-act=exportXls]', '[data-act=exportJson]', '[data-act=approve]'];
  hide.forEach(sel => $$(sel).forEach(e => e.remove()));
  $$('[data-chg=importJson]').forEach(e => (e.closest('label') || e).remove());
  $$('input[name=ca],input[name=cb]').forEach(e => e.closest('label')?.remove());
  const logo = $('[data-chg=logo]'); if (logo) logo.closest('label.f')?.remove();
}

function licenseNotice() {
  const st = licStatus();
  if (st.state === 'trial') return `<div class="msg w noprint">نسخة تجريبية — باقي <b>${st.left}</b> يوماً. بعض الميزات مخفية (الطباعة وPDF وExcel، والنسخ الاحتياطي، والغياب والبدلاء، وسجل التغييرات، وبعض التقارير). <a href="#" data-act="go" data-p="activation">فعّل البرنامج</a></div>`;
  return '';
}

PAGES.activation = () => {
  const st = licStatus();
  const head = st.state === 'active' ? '<div class="msg o">✅ البرنامج مفعّل بالكامل. شكراً لك.</div>'
    : st.state === 'expired' ? `<div class="msg c">انتهت الفترة التجريبية${st.tamper ? ' (اكتُشف تغيير في تاريخ الجهاز)' : ''}. <b>بياناتك محفوظة ولم يُحذف منها شيء</b>، وتُفتح كل الميزات فور التفعيل.</div>`
      : `<div class="msg w">نسخة تجريبية — باقي <b>${st.left}</b> يوماً من ${LIC_CFG.TRIAL_DAYS}.</div>`;
  return `<div class="card">${head}
    <div class="form" style="margin-top:10px"><div><b>رقم الجهاز</b><div class="row" style="margin-top:6px"><input type="text" id="devId" value="${LIC.dev}" readonly style="max-width:200px;direction:ltr;text-align:center;font-weight:700;letter-spacing:2px"><button class="btn" data-act="copyDev">نسخ</button></div>
      <p class="muted">أرسل هذا الرقم إلى المطوّر لتحصل على كود التفعيل الخاص بجهازك.</p></div>
      ${st.state === 'active' ? '' : `<div><b>كود التفعيل</b><div class="row" style="margin-top:6px"><input type="text" id="actCode" placeholder="XXXX-XXXX-XXXX-XXXX" style="max-width:280px;direction:ltr;text-align:center;letter-spacing:2px"><button class="btn pri" data-act="doActivate">تفعيل</button></div></div>`}</div>
    ${st.state === 'expired' ? '<div class="row" style="margin-top:14px"><button class="btn" data-act="exportJsonForce">⬇️ تصدير نسخة احتياطية من بياناتي</button></div>' : ''}</div>
  ${st.state === 'trial' ? `<div class="card"><h3>ما الذي يُفتح بعد التفعيل؟</h3><ul><li>الطباعة وحفظ PDF وتصدير Excel</li><li>تصدير النسخ الاحتياطية JSON واستعادتها ومقارنة النسخ</li><li>صفحة الغياب والبدلاء</li><li>سجل التغييرات</li><li>التقارير الكاملة (الشامل، القيود، توزيع أيام العمل، جودة وعدالة الجدول، الغياب والبدلاء)</li><li>اعتماد الجدول النهائي وشعار المدرسة في التقارير</li></ul></div>` : ''}`;
};
ACT.copyDev = () => { const i = $('#devId'); i.select(); try { navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand('copy'); } toast('تم نسخ رقم الجهاز'); };
ACT.doActivate = () => {
  const v = $('#actCode').value; if (!v.trim()) return toast('أدخل كود التفعيل', 'warn');
  if (licActivate(v)) { toast('✅ تم تفعيل البرنامج بنجاح'); render(); } else toast('الكود غير صحيح لهذا الجهاز. تأكد من نسخه كاملاً.', 'err');
};
ACT.exportJsonForce = () => download('نسخة-احتياطية-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', JSON.stringify({ app: 'schoolTT', v: 1, state: S }));

</script>
<script>
'use strict';
/* =====================================================================
   pages1.js — لوحة التحكم، الإعداد السريع، المدرسة، الصفوف، المواد، التوزيع
   ===================================================================== */

/* ---------- لوحة التحكم ---------- */
PAGES.dashboard = () => {
  const st = stats(); const V = validate();
  const cards = [
    ['عدد الصفوف', new Set(S.classes.map(c => c.grade)).size], ['عدد الشعب', S.classes.length], ['عدد المعلمين', S.teachers.length],
    ['عدد المواد', S.subjects.length], ['إجمالي الحصص الأسبوعية', st.total], ['الحصص الموزعة', st.placed, 'ok'],
    ['الحصص غير الموزعة', st.unplaced, st.unplaced ? 'err' : 'ok'], ['التعارضات', st.conflicts, st.conflicts ? 'err' : 'ok'],
    ['القيود الثابتة', st.cons], ['نسبة اكتمال الجدول', st.pct + '%'], ['مؤشر جودة الجدول', st.q.score + '/100']
  ];
  const todo = [...V.critical.slice(0, 5)];
  return `<div class="stats">${cards.map(([t, v, c]) => `<div class="stat ${c || ''}"><b>${v}</b><span>${t}</span></div>`).join('')}</div>
  <div class="card"><div class="row" style="margin-bottom:10px"><div style="flex:1"><div class="bar"><i style="width:${st.pct}%"></i></div></div><b>${st.pct}%</b></div>
    <div class="row noprint">
      <button class="btn" data-act="go" data-p="teachers" data-add="1">➕ إضافة معلم</button>
      <button class="btn" data-act="addSection">➕ إضافة صف/شعبة</button>
      <button class="btn" data-act="addSubjectGlobal">➕ إضافة مادة</button>
      <button class="btn" data-act="autoSubjects">📚 إعداد المواد تلقائياً</button>
      <button class="btn pri" data-act="runGen">⚙️ توزيع الجدول تلقائياً</button>
      <button class="btn" data-act="go" data-p="gen">🔍 فحص الجدول</button>
      <button class="btn" data-act="go" data-p="general">🗺️ عرض الجدول العام</button>
      <button class="btn" data-act="go" data-p="reports">🖨️ طباعة التقارير</button>
    </div></div>
  <div class="grid g2">
    <div class="card"><h3>ما يحتاج إلى انتباه</h3>${todo.length ? todo.map(x => `<div class="msg c">${esc(x.msg)}<small>${esc(x.fix)}</small></div>`).join('') : '<div class="msg o">لا توجد أخطاء حرجة.</div>'}
      ${V.critical.length > 5 ? `<p class="muted">و${V.critical.length - 5} ملاحظات أخرى في صفحة الفحص.</p>` : ''}</div>
    <div class="card"><h3>جودة الجدول: ${st.q.score}/100</h3>${st.q.reasons.length ? st.q.reasons.slice(0, 5).map(r => `<div class="msg w">${esc(r.txt)}</div>`).join('') : '<div class="msg o">لا توجد أسباب لانخفاض الدرجة.</div>'}
      <p class="muted">الدرجة مؤشر مساعد للمدير وليست قراراً إلزامياً.</p></div>
  </div>`;
};

ACT.addSection = () => {
  openModal('إضافة صف أو شعبة', field('نوع الإضافة', `<select name="k"><option value="sec">شعبة جديدة لصف موجود</option><option value="grade">صف جديد</option></select>`) +
    field('الصف الموجود (للشعبة)', `<select name="g">${selOpts([...new Set(S.classes.map(c => c.grade))].map(g => [g, 'الصف ' + (GRADE_NAMES[g - 1] || g)]), 1)}</select>`) +
    field('اسم الصف الجديد', inp('n', '')) + field('قالب المواد للصف الجديد', `<select name="t">${selOpts([[0, 'بدون مواد'], ...range(1, 6).map(g => [g, 'مواد الصف ' + GRADE_NAMES[g - 1]])], 0)}</select>`), {
    onSave: m => {
      const v = formVals(m);
      if (v.k === 'sec') { const g = +v.g; const c = createClass(g, nextSection(g)); commit(`إضافة شعبة ${c.name} مع موادها الافتراضية`); toast('✅ تم إنشاء المواد تلقائياً للشعبة ' + c.name); }
      else {
        if (!v.n.trim()) { toast('أدخل اسم الصف', 'warn'); return false; }
        const g = Math.max(6, ...S.classes.map(c => c.grade)) + 1; const c = createClass(g, 'أ', v.n.trim() + ' أ', +v.t || 0);
        if (!+v.t) S.assign.filter(a => a.classId === c.id).slice().forEach(removeAssign);
        commit('إضافة صف جديد ' + v.n);
      }
    }
  });
};

ACT.autoSubjects = async () => {
  const need = S.classes.filter(c => !S.assign.some(a => a.classId === c.id));
  if (!S.classes.length) { seedDefaults(); commit('إنشاء البيانات الافتراضية'); return toast('✅ تم إنشاء الصفوف الستة ومواد كل صف', 'ok'); }
  if (!need.length) return toast('جميع الشعب لديها مواد. لإعادة الافتراضي استخدم «إعادة المواد الافتراضية» في صفحة التوزيع.', 'warn');
  need.forEach(applyTemplate); commit('إعداد المواد تلقائياً لـ ' + need.length + ' شعبة'); toast('✅ تم إنشاء المواد تلقائياً', 'ok');
};

ACT.runGen = () => { goPage('gen'); setTimeout(() => ACT.gen(), 50); };

/* ---------- الإعداد السريع ---------- */
PAGES.wizard = () => {
  const st = stats(); const V = validate();
  const allAsg = S.assign.length > 0 && S.assign.every(a => a.teacherId);
  const hasSubj = S.classes.length > 0 && S.classes.every(c => S.assign.some(a => a.classId === c.id));
  const hasRest = S.teachers.some(t => (t.offDays || []).length || Object.values(t.unavail || {}).some(a => a.length));
  const final = getVersions().some(v => v.type === 'final');
  const steps = [
    ['معلومات المدرسة', !!S.school.name, 'school'], ['عدد الصفوف والشعب', S.classes.length > 0, 'classes'],
    ['إنشاء المواد والحصص تلقائياً', hasSubj, 'assign'], ['إضافة المعلمين', S.teachers.length > 0, 'teachers'],
    ['اختيار معلم لكل مادة', allAsg, 'assign'], ['تحديد أيام العمل والراحة', hasRest, 'teachers'],
    ['إضافة القيود', st.cons > 0, 'subjects'], ['توليد الجدول', st.placed > 0, 'gen'],
    ['فحص الجدول', st.placed > 0 && V.critical.length === 0, 'gen'], ['اعتماد الجدول وطباعة التقارير', final, 'reports']
  ];
  return `<div class="card"><p>العملية الأساسية: أنشئ الشعب ← تظهر المواد تلقائياً ← أضف المعلمين ← اختر معلماً لكل مادة ← حدّد الراحة والقيود ← ولّد الجدول ← افحص ← اعتمد ← اطبع.</p>
  ${steps.map(([t, ok, pg], i) => `<div class="row sp msg ${ok ? 'o' : 'i'}"><span><b>${i + 1}.</b> ${ok ? '✅' : '⬜'} ${t}</span><button class="btn sm" data-act="go" data-p="${pg}">${ok ? 'مراجعة' : 'ابدأ'}</button></div>`).join('')}
  <div class="row noprint" style="margin-top:12px"><button class="btn pri" data-act="approve">✔ اعتماد الجدول (حفظ نسخة نهائية)</button></div></div>`;
};
ACT.approve = async () => {
  const V = validate();
  if (V.critical.length && !(await ask('يوجد ' + V.critical.length + ' خطأ حرج في الجدول. هل تريد اعتماده رغم ذلك؟'))) return;
  saveVersion('الجدول النهائي المعتمد – ' + fmtDate(Date.now()), 'final'); logChange('اعتماد الجدول كنسخة نهائية'); save(); toast('✅ تم حفظ النسخة النهائية'); goPage('reports');
};

/* ---------- معلومات المدرسة ---------- */
PAGES.school = () => {
  const sc = S.school; const times = periodTimes();
  return `<div class="card"><form id="schoolForm" class="form" onsubmit="return false">
    ${field('اسم المدرسة', inp('name', sc.name))}${field('المديرية', inp('directorate', sc.directorate))}${field('قسم التربية', inp('section', sc.section))}

ACT.saveSchool = async () => {

function teacherOptions(a) {

async function changeCount(a, n) {
  n = Math.max(0, Math.min(60, Math.round(+n) || 0)); if (n === a.count) return render();
  const old = a.count, s = getSub(a.subjectId), c = getC(a.classId);
  a.count = n; let r = syncLessons(a);
  if (r.blocked) {
    a.count = old;
    if (await ask('هذه الحصة مثبتة ولا يمكن حذفها تلقائياً، هل تريد إلغاء تثبيتها أولاً؟', { yes: 'إلغاء التثبيت والمتابعة' })) {
      r.blocked.forEach(l => { l.locked = false; }); a.count = n; syncLessons(a, true);
    } else return render();

  commit(`تغيير ${s.name} للصف ${c.name} من ${old} حصة إلى ${n} حصة`, old, n);
}
function asgStatus(a, A) {
  const t = getT(a.teacherId), c = getC(a.classId);
  if (!t) return ['🟡', 'تحتاج إلى معلم'];
  if (a.count <= 0 || a.count > classSlots(c)) return ['🟠', 'عدد الحصص يحتاج إلى مراجعة'];
  if (A.hard.some(h => h.l.asgId === a.id) || S.lessons.some(l => l.asgId === a.id && A.conflictLessons.has(l.id))) return ['🔴', 'يوجد تعارض'];
  if (S.lessons.some(l => l.asgId === a.id && l.day == null)) return ['🔵', 'تحتاج إلى توزيع'];
  return ['🟢', 'مكتملة'];
}

    <div class="row noprint"><button class="btn pri" data-act="addAsg">➕ إضافة مادة</button><button class="btn" data-act="autoTeachers">🤖 اقتراح معلمين حسب الاختصاص</button><button class="btn" data-act="copyClass" data-id="${c.id}">نسخ إعدادات المواد</button><button class="btn danger" data-act="resetDefaults">إعادة المواد الافتراضية</button></div></div>
    ${diff}
    <div class="scroll" style="margin-top:10px"><table class="dt"><thead><tr><th>المادة</th><th>الحصص الأسبوعية</th><th>المعلم</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows || '<tr><td colspan="5" class="muted">لا توجد مواد. اضغط «إضافة مادة» أو «إعادة المواد الافتراضية».</td></tr>'}</tbody></table></div>
    <p class="muted">🟢 مكتملة · 🟡 تحتاج إلى معلم · 🔵 تحتاج إلى توزيع · 🔴 يوجد تعارض · 🟠 عدد الحصص يحتاج إلى مراجعة</p></div>
    <div class="card"><h3>نصاب المعلمين</h3><div class="scroll">${quotaTable()}</div></div>`;
};
CHG.asgClass = el => { UI.asgClass = el.value; render(); };
CHG.asgTeacher = el => setTeacherByUI(getA(el.dataset.id), el.value);
CHG.cntIn = el => changeCount(getA(el.dataset.id), el.value);
ACT.cnt = el => { const a = getA(el.dataset.id); return changeCount(a, a.count + +el.dataset.d); };
ACT.lockAsg = el => { const a = getA(el.dataset.id); a.locked = !a.locked; commit((a.locked ? 'قفل' : 'فك قفل') + ' مادة ' + getSub(a.subjectId).name); };
ACT.delAsg = async el => {
  const a = getA(el.dataset.id), s = getSub(a.subjectId), c = getC(a.classId);
  const pinned = S.lessons.filter(l => l.asgId === a.id && l.day != null && isLocked(l));
  const msg = `سيتم حذف المادة وحصصها غير المثبتة من هذه الشعبة. هل أنت متأكد؟` + (pinned.length ? `<br><b>تنبيه:</b> يوجد ${pinned.length} حصة مثبتة ستُحذف أيضاً:<br>` + pinned.map(l => `${DAYS_ALL[l.day]} – الحصة ${l.period}`).join('، ') : '');
  if (!(await ask(msg, { danger: true, yes: 'حذف' }))) return;
  removeAssign(a); commit(`حذف مادة ${s.name} من ${c.name}`);
};
ACT.resetDefaults = async () => {
  const c = getC(UI.asgClass);
  if (!(await ask(`سيتم استبدال مواد «${esc(c.name)}» بالمواد الافتراضية وستضيع تعديلاتك الحالية (يؤخذ نسخ احتياطي تلقائي). متابعة؟`, { danger: true, yes: 'إعادة الافتراضي' }))) return;
  autoBackup('إعادة المواد الافتراضية'); resetClassDefaults(c); commit('إعادة المواد الافتراضية للشعبة ' + c.name);
};
ACT.addAsg = () => {
  const c = getC(UI.asgClass);
  openModal('إضافة مادة إلى ' + esc(c.name), `<div class="form">${field('المادة', `<input list="subjList" name="sname" placeholder="اختر أو اكتب اسماً جديداً"><datalist id="subjList">${S.subjects.map(s => `<option value="${esc(s.name)}">`).join('')}${Object.keys(BASE_SUBJECTS).map(n => `<option value="${esc(n)}">`).join('')}</datalist>`)}
    ${field('عدد الحصص الأسبوعية', inp('count', 2, 'number', 'min="1" max="30"'))}${field('المعلم (اختياري)', `<select name="t"><option value="">— لاحقاً —</option>${selOpts(S.teachers.map(t => [t.id, t.name]), '')}</select>`)}</div>`, {
    onSave: m => {
      const v = formVals(m); const n = v.sname.trim(); if (!n) { toast('أدخل اسم المادة', 'warn'); return false; }
      if (S.assign.some(a => a.classId === c.id && getSub(a.subjectId).name === n)) { toast('المادة موجودة في الشعبة', 'warn'); return false; }
      const s = ensureSubject(n); addAssign(c, s.id, Math.max(1, +v.count || 1), v.t || null);
      commit(`إضافة مادة ${n} (${v.count} حصة) إلى ${c.name}`); toast('✅ أضيفت المادة إلى الشعبة والنصاب ومحرك الجدولة');
    }
  });
};
ACT.autoTeachers = () => {
  let n = 0;
  S.assign.filter(a => !a.teacherId).forEach(a => {
    const s = getSub(a.subjectId);
    const c = S.teachers.filter(t => specMatches(t, s) && t.specialty !== GENERAL_SPEC).concat(S.teachers.filter(t => t.specialty === GENERAL_SPEC));
    c.sort((x, y) => teacherStats(x).load - teacherStats(y).load);
    if (c.length) { setTeacherForAssign(a, c[0].id); n++; }
  });
  commit(`اقتراح معلمين حسب الاختصاص لـ ${n} مادة`); toast(n ? `✅ عُيّن معلم لـ ${n} مادة — راجع الاختيارات` : 'لا يوجد معلمون مناسبون. أضف معلمين أولاً.', n ? 'ok' : 'warn');
};
ACT.asgCons = el => {
  const a = getA(el.dataset.id), s = getSub(a.subjectId);
  openModal('قيود مادة ' + esc(s.name) + ' في هذه الشعبة', `<b>حصص ممنوعة لهذه المادة في هذه الشعبة</b><div class="checks">${periodChecks('forbidP', a.forbidP || [])}</div><p class="muted">القيود العامة للمادة تُعدَّل من صفحة «المواد الدراسية».</p>`, {
    onSave: m => { a.forbidP = (formVals(m).forbidP || []).map(Number); commit('تعديل قيود مادة ' + s.name); }
  });
};
ACT.pinLesson = el => {
  const a = getA(el.dataset.id), s = getSub(a.subjectId), c = getC(a.classId);
  openModal('تثبيت حصة: ' + esc(s.name) + ' – ' + esc(c.name), `<div class="form">${field('اليوم', `<select name="d">${selOpts(range(0, nd() - 1).map(d => [d, DAYS_ALL[d]]), 0)}</select>`)}${field('رقم الحصة', `<select name="p">${selOpts(range(1, clsPeriods(c)).map(p => [p, p]), 1)}</select>`)}</div><p class="muted">بعد التثبيت لن يحرّك المولّد التلقائي هذه الحصة.</p>`, {
    saveText: 'تثبيت', onSave: async m => {
      const v = formVals(m); const d = +v.d, p = +v.p;
      const why = (() => { const free = S.lessons.find(l => l.asgId === a.id && (l.day == null || !isLocked(l))); return free ? staticReason(free, d, p) : 'لا توجد حصة متاحة للتثبيت'; })();
      if (why) { toast('لا يمكن: ' + why, 'err'); return false; }
      const occ = S.lessons.find(l => l.classId === c.id && l.day === d && l.period === p);
      if (occ && isLocked(occ)) { toast('الفترة مشغولة بحصة مثبتة', 'err'); return false; }
      const mine = S.lessons.find(l => l.asgId === a.id && l.day == null) || S.lessons.find(l => l.asgId === a.id && !isLocked(l));
      const busy = a.teacherId && S.lessons.find(l => l !== mine && l.teacherId === a.teacherId && l.day === d && l.period === p);
      if (busy && !(await ask('المعلم لديه حصة أخرى في الوقت نفسه. تثبيت رغم التعارض؟'))) return false;
      if (occ && occ !== mine) { occ.day = null; occ.period = null; }
      mine.day = d; mine.period = p; mine.locked = true;
      commit(`تثبيت ${s.name} (${c.name}) يوم ${DAYS_ALL[d]} الحصة ${p}`);
    }
  });
};

</script>
<script>
'use strict';
/* =====================================================================
   pages2.js — المعلمون، التوليد والفحص، جداول الشعبة/المعلم/العام، الغياب
   ===================================================================== */

/* ---------- ملفات المعلمين ---------- */
function teacherTable() {
  let list = S.teachers.slice();
  if (UI.fSpec) list = list.filter(t => t.specialty === UI.fSpec);
  if (UI.tq) list = list.filter(t => (t.name + t.specialty + t.jobTitle).includes(UI.tq));
  const val = { name: t => t.name, load: t => -teacherStats(t).load, spec: t => t.specialty }[UI.tSort];
  list.sort((a, b) => String(val(a)).localeCompare(String(val(b)), 'ar', { numeric: true }));
  const A = analyze();
  const rows = list.map(t => {
    const st = teacherStats(t); const m = A.tm[t.id];
    const cls = st.pct > 100 ? 'err' : st.pct >= 90 ? 'ok' : 'warn';
    return [`<span class="sw" style="background:${t.color}"></span>${esc(t.name)}${t.locked ? ' 🔒' : ''}`, esc(t.specialty), t.quota, st.load,
      `<span class="chip ${cls}">${st.diff > 0 ? '+' : ''}${st.diff} (${st.pct}%)</span>`, `${st.subjects} مادة / ${st.classes} شعبة`,
      `${m.days} من ${nd() - (t.offDays || []).length}`,
      `<div class="row noprint"><button class="btn sm" data-act="editTeacher" data-id="${t.id}">تعديل</button><button class="btn sm" data-act="viewTeacher" data-id="${t.id}">جدوله</button><button class="btn sm danger" data-act="delTeacher" data-id="${t.id}">حذف</button></div>`];
  });
  return `<div class="scroll">${tbl(['المعلم', 'الاختصاص', 'النصاب', 'الحصص الفعلية', 'الفرق / الاستكمال', 'المواد والشعب', 'أيام العمل', 'إجراءات'], rows)}</div>`;
}
PAGES.teachers = () => `<div class="card"><div class="row sp noprint" style="margin-bottom:12px">
  <div class="row"><input type="text" placeholder="🔍 بحث بالاسم أو الاختصاص" value="${esc(UI.tq)}" data-inp="tq" style="width:230px">
  <select data-chg="fSpec" style="width:190px"><option value="">كل الاختصاصات</option>${selOpts(SPECIALTIES.map(x => [x, x]), UI.fSpec)}</select>
  <select data-chg="tSort" style="width:150px">${selOpts([['name', 'فرز: الاسم'], ['load', 'فرز: الحصص'], ['spec', 'فرز: الاختصاص']], UI.tSort)}</select></div>
  <button class="btn pri" data-act="editTeacher">➕ إضافة معلم</button></div>
  <div id="tlist">${teacherTable()}</div></div>`;
INP.tq = el => { UI.tq = el.value; $('#tlist').innerHTML = teacherTable(); };
CHG.fSpec = el => { UI.fSpec = el.value; render(); };
CHG.tSort = el => { UI.tSort = el.value; render(); };
ACT.viewTeacher = el => { UI.teacherId = el.dataset.id; goPage('tteacher'); };
ACT.delTeacher = async el => {
  const t = getT(el.dataset.id), st = teacherStats(t);
  if (!(await ask(`سيتم حذف المعلم «${esc(t.name)}» وتفريغ ${st.load} حصة من اسمه (تُحفظ نسخته في سلة المحذوفات). متأكد؟`, { danger: true, yes: 'حذف' }))) return;
  autoBackup('حذف معلم ' + t.name); removeTeacher(t); commit('حذف المعلم ' + t.name);
};
ACT.editTeacher = el => {
  const t0 = el.dataset && el.dataset.id ? getT(el.dataset.id) : null; const t = t0 || newTeacher('');
  const grid = range(0, nd() - 1).map(d => `<tr><th><label><input type="checkbox" data-multi="1" name="work" value="${d}" ${(t.offDays || []).includes(d) ? '' : 'checked'}> ${DAYS_ALL[d]}</label></th>${range(1, np()).map(p => `<td style="text-align:center"><input type="checkbox" name="av_${d}_${p}" ${(t.unavail && t.unavail[d] && t.unavail[d].includes(p)) ? '' : 'checked'}></td>`).join('')}</tr>`).join('');
  openModal(t0 ? 'تعديل المعلم' : 'إضافة معلم', `<div class="form">
    ${field('الاسم الكامل', inp('name', t.name), 'full')}${field('الاختصاص', `<select name="specialty">${selOpts(SPECIALTIES.map(x => [x, x]), t.specialty)}</select>`)}
    ${field('العنوان الوظيفي', inp('jobTitle', t.jobTitle))}${field('الشهادة', inp('degree', t.degree))}${field('تاريخ الميلاد', inp('birth', t.birth, 'date'))}
    ${field('تاريخ التعيين', inp('hireDate', t.hireDate, 'date'))}${field('تاريخ أول مباشرة', inp('startDate', t.startDate, 'date'))}${field('الملاك', inp('staff', t.staff))}
    ${field('المدرسة', inp('schoolOrigin', t.schoolOrigin))}${field('نوع التعيين', `<select name="employment">${selOpts(EMPLOYMENT.map(x => [x, x]), t.employment)}</select>`)}
    ${field('لون المعلم', inp('color', t.color, 'color'))}${field('النصاب الأسبوعي', inp('quota', t.quota, 'number', 'min="1" max="40"'))}
    ${field('الحد الأقصى للحصص المتتالية', inp('maxConsec', t.maxConsec || S.settings.maxConsec, 'number', 'min="1" max="7"'))}
    <div class="full"><b>أيام العمل والتوفر</b> <small>(أزل العلامة من اليوم ليكون يوم راحة، ومن الخلية لتكون الحصة غير متاحة)</small>
      <div class="scroll"><table class="dt"><thead><tr><th>اليوم</th>${range(1, np()).map(p => `<th>${p}</th>`).join('')}</tr></thead><tbody>${grid}</tbody></table></div></div>
    <div class="full"><b>قيود إلزامية</b><div class="checks"><label><input type="checkbox" name="noFirst" ${t.noFirst ? 'checked' : ''}>لا يعمل الحصة الأولى</label><label><input type="checkbox" name="noLast" ${t.noLast ? 'checked' : ''}>لا يعمل الحصة الأخيرة</label></div></div>
    <div class="full"><b>تفضيلات (يمكن مخالفتها عند الضرورة)</b><div class="checks"><label><input type="checkbox" name="avoidFirst" ${t.avoidFirst ? 'checked' : ''}>يفضل عدم الحصة الأولى</label><label><input type="checkbox" name="avoidLast" ${t.avoidLast ? 'checked' : ''}>يفضل عدم الحصة الأخيرة</label><label><input type="checkbox" name="noConsec" ${t.noConsec ? 'checked' : ''}>يفضل عدم الحصص المتتالية</label><label><input type="checkbox" name="spread" ${t.spread ? 'checked' : ''}>يفضل توزيع حصصه على أيام متعددة</label></div>
      ${field('يوم راحة مفضل', `<select name="prefOff"><option value="">— لا يوجد —</option>${selOpts(range(0, nd() - 1).map(d => [d, DAYS_ALL[d]]), t.prefOff)}</select>`)}</div>
    <div class="full"><b>قفل أيام من جدول المعلم</b><div class="checks">${range(0, nd() - 1).map(d => `<label><input type="checkbox" data-multi="1" name="lday" value="${d}" ${(t.lockedDays || []).includes(d) ? 'checked' : ''}>${DAYS_ALL[d]}</label>`).join('')}<label><input type="checkbox" name="locked" ${t.locked ? 'checked' : ''}>قفل جدول المعلم كاملاً</label></div></div>
    ${field('ملاحظات', `<textarea name="notes" rows="2">${esc(t.notes)}</textarea>`, 'full')}</div>`, {
    wide: true, onSave: m => {
      const v = formVals(m); if (!v.name.trim()) { toast('أدخل اسم المعلم', 'warn'); return false; }
      Object.assign(t, {
        name: v.name.trim(), specialty: v.specialty, jobTitle: v.jobTitle, degree: v.degree, birth: v.birth, hireDate: v.hireDate, startDate: v.startDate, staff: v.staff,
        schoolOrigin: v.schoolOrigin, employment: v.employment, color: v.color, quota: +v.quota || 24, maxConsec: +v.maxConsec || 3, noFirst: v.noFirst, noLast: v.noLast,
        avoidFirst: v.avoidFirst, avoidLast: v.avoidLast, noConsec: v.noConsec, spread: v.spread, prefOff: v.prefOff === '' ? null : +v.prefOff,
        lockedDays: (v.lday || []).map(Number), locked: v.locked, notes: v.notes
      });
      const work = (v.work || []).map(Number); t.offDays = range(0, nd() - 1).filter(d => !work.includes(d));
      t.unavail = {}; range(0, nd() - 1).forEach(d => { const bad = range(1, np()).filter(p => !v['av_' + d + '_' + p]); if (bad.length) t.unavail[d] = bad; });
      if (!t0) S.teachers.push(t);
      reindex();
      let moved = 0; S.lessons.forEach(l => { if (l.teacherId === t.id && l.day != null && !isLocked(l) && staticReason(l, l.day, l.period)) { l.day = null; l.period = null; moved++; } });
      commit((t0 ? 'تعديل المعلم ' : 'إضافة المعلم ') + t.name);
      if (moved) toast(`أُزيلت ${moved} حصة من أوقات لم تعد متاحة — أعد التوليد أو ضعها يدوياً`, 'warn');
    }
  });
};

/* ---------- التوليد والفحص ---------- */
PAGES.gen = () => {
  const V = validate(); const pre = preCheck(); const r = UI.genRes;
  const failed = unplacedReport();
  return `<div class="card"><div class="row sp"><div class="row noprint">
      <button class="btn pri" data-act="gen">⚙️ توليد الجدول تلقائياً</button>
      <button class="btn" data-act="go" data-p="gen">🔍 فحص الجدول</button>
      <button class="btn" data-act="clearAll">🧹 مسح الحصص غير المثبتة</button>
      <button class="btn ${S.locks.full ? 'acc' : ''}" data-act="lockFull">${S.locks.full ? '🔓 فتح قفل الجدول' : '🔒 قفل الجدول بالكامل'}</button></div>
      <div class="chip ${V.quality.score >= 80 ? 'ok' : V.quality.score >= 55 ? 'warn' : 'err'}">جودة الجدول: ${V.quality.score}/100</div></div>
    <p class="muted">الأولوية: الحصص المثبتة ← القيود الإلزامية ← الأقل توفراً ← قيود المواد والشعب ← النصاب وأيام العمل ← تقليل المتتالية والفراغات ← عدالة الحصص الأولى والأخيرة. تبقى الحصص المثبتة والمقفلة كما هي.</p>
    ${r ? `<div class="msg ${r.unplaced ? 'w' : 'o'}">آخر توليد: ${r.attempts} محاولة، ${r.ms} ملّي ثانية، ${r.unplaced ? r.unplaced + ' حصة تعذر توزيعها' : 'تم توزيع جميع الحصص'}.</div>` : ''}</div>
  ${(r && r.unplaced) || failed.length ? `<div class="card"><h3>تعذر توزيع الجدول بسبب:</h3>
    ${failed.map(u => `<div class="msg c"><b>${esc(u.s.name)} – ${esc(u.c.name)}</b> (${u.n} حصة): ${esc(u.why.join(' · '))}</div>`).join('')}
    ${pre.map(x => `<div class="msg c">${esc(x)}</div>`).join('')}
    <h4>حلول مقترحة (لا يغيّر البرنامج القيود تلقائياً)</h4><ul>${FAIL_SOLUTIONS.map(x => `<li>${x}</li>`).join('')}</ul></div>` :
    (pre.length ? `<div class="card"><h3>تنبيهات قبل التوليد</h3>${pre.map(x => `<div class="msg w">${esc(x)}</div>`).join('')}</div>` : '')}
  <div class="card"><h3>أخطاء حرجة (${V.critical.length})</h3>${V.critical.map(x => `<div class="msg c">${esc(x.msg)}<small>الحل المقترح: ${esc(x.fix)}</small></div>`).join('') || '<div class="msg o">لا توجد أخطاء حرجة ✅</div>'}</div>
  <div class="card"><h3>تحذيرات (${V.warnings.length})</h3>${V.warnings.map(x => `<div class="msg w">${esc(x.msg)}<small>الحل المقترح: ${esc(x.fix)}</small></div>`).join('') || '<div class="msg o">لا توجد تحذيرات ✅</div>'}</div>
  <div class="card"><h3>مؤشر الجودة والعدالة: ${V.quality.score}/100</h3>${V.quality.reasons.map(x => `<div class="msg i">${esc(x.txt)}</div>`).join('') || '<div class="msg o">لا أسباب لخفض الدرجة.</div>'}<p class="muted">المؤشر استرشادي ولا تُتخذ به قرارات إلزامية.</p></div>`;
};
ACT.gen = async () => {
  if (!S.lessons.length) return toast('لا توجد حصص. أنشئ الشعب والمواد أولاً.', 'warn');
  const unt = S.assign.filter(a => !a.teacherId).length;
  if (unt && !(await ask(`يوجد ${unt} مادة بلا معلم، ولن تُوزَّع حصصها بدقة القيود. المتابعة؟`, { yes: 'متابعة' }))) return;
  autoBackup('توليد الجدول');
  openModal('جارٍ توليد الجدول…', '<p class="row"><span class="spin" style="border-color:#1d6b78 #1d6b7855 #1d6b7855 #1d6b7855"></span> يتم توزيع الحصص وتحسين الجدول، لحظات من فضلك.</p>', { focus: false });
  await new Promise(r => setTimeout(r, 80));
  const res = generate({ ms: 3500 }); UI.genRes = res; closeModal();
  commit(`توليد الجدول تلقائياً (${res.unplaced ? res.unplaced + ' حصة غير موزعة' : 'اكتمل التوزيع'})`);
  toast(res.unplaced ? `تم التوزيع مع ${res.unplaced} حصة متعذرة — راجع الأسباب` : '✅ تم توليد الجدول بنجاح', res.unplaced ? 'warn' : 'ok');
};
ACT.clearAll = async () => {
  if (!(await ask('سيتم إفراغ جميع الحصص غير المثبتة من الجدول (المثبتة تبقى). متابعة؟', { danger: true }))) return;
  autoBackup('مسح الجدول'); clearUnlocked(); commit('مسح الحصص غير المثبتة');
};
ACT.lockFull = () => { S.locks.full = !S.locks.full; commit(S.locks.full ? 'قفل الجدول بالكامل' : 'فتح قفل الجدول'); };

/* ---------- جدول الشعبة ---------- */
PAGES.tclass = () => {
  if (!S.classes.length) return PAGES.classes();

<script>
'use strict';
/* =====================================================================
   pages3.js — التقارير والتصدير، النسخ والنسخ الاحتياطي، سجل التغييرات
   ===================================================================== */

/* ---------- التقارير ---------- */
function pageStyle() {
  const st = $('#pageStyle') || Object.assign(document.head.appendChild(document.createElement('style')), { id: 'pageStyle' });
  st.textContent = `@page{size:${S.settings.paper} ${S.settings.orient};margin:10mm}`;

PAGES.reports = () => {
  pageStyle();
  const list = isTrial() ? REPORTS.filter(r => TRIAL_REPORTS.includes(r.id)) : REPORTS;
  const rep = list.find(r => r.id === UI.repId) || list[0];
  return `<div class="card noprint"><div class="row">${list.map(r => `<button class="btn sm ${r.id === rep.id ? 'pri' : ''}" data-act="repSel" data-id="${r.id}">${r.name}</button>`).join('')}</div>
    <div class="row" style="margin-top:12px">
      <label class="f">الورق<select data-chg="paper">${selOpts([['A4', 'A4'], ['A3', 'A3']], S.settings.paper)}</select></label>
      <label class="f">الاتجاه<select data-chg="orient">${selOpts([['landscape', 'أفقي'], ['portrait', 'عمودي']], S.settings.orient)}</select></label>
      <div class="row" style="align-self:end"><button class="btn pri" data-act="printNow">🖨️ طباعة / معاينة</button><button class="btn" data-act="exportPdf">📄 حفظ PDF</button><button class="btn" data-act="exportXls">📊 تصدير Excel</button></div></div>
    <p class="muted">للـ PDF: اختر «حفظ بصيغة PDF» من نافذة الطباعة. ملف Excel يُفتح مباشرة في Excel وبألوانه واتجاه RTL.</p></div>
    <div id="repBody">${rep.fn()}</div>`;
};
ACT.repSel = el => { UI.repId = el.dataset.id; render(); };
CHG.paper = el => { S.settings.paper = el.value; save(); pageStyle(); };
CHG.orient = el => { S.settings.orient = el.value; save(); pageStyle(); };
ACT.exportPdf = () => { toast(window.FlutterBridge ? 'اختر «حفظ كـ PDF» أو «مشاركة» من شاشة المعاينة' : 'اختر «حفظ بصيغة PDF» كوجهة في نافذة الطباعة', 'ok'); setTimeout(() => window.print(), 400); };
function download(name, mime, content) {
  /* داخل تطبيق الهاتف (Flutter): تُرسل الملفات إلى الجسر ليحفظها ويشاركها */
  if (window.FlutterBridge) {
    const b64 = btoa(unescape(encodeURIComponent('\ufeff' + content)));
    window.FlutterBridge.postMessage(JSON.stringify({ type: 'file', name, mime, b64 }));
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + content], { type: mime + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
ACT.exportXls = () => {
  const rep = REPORTS.find(r => r.id === UI.repId) || REPORTS[0];
  download(rep.name + '.xls', 'application/vnd.ms-excel', excelHTML($('#repBody').innerHTML));
  logChange('تصدير تقرير Excel: ' + rep.name); save();
};

/* ---------- النسخ والنسخ الاحتياطي ---------- */
PAGES.versions = () => {
  const vs = getVersions();
  const kind = { manual: 'يدوية', auto: 'تلقائية', final: 'نهائية', initial: 'أولية', edited: 'معدلة', backup: 'احتياطية' };
  const cmp = (UI.cmpA && UI.cmpB && UI.cmpA !== UI.cmpB) ? compareVersions(UI.cmpA, UI.cmpB) : '';
  return `<div class="card"><h3>حفظ نسخة من الجدول</h3><div class="row">
    <input type="text" id="verName" placeholder="اسم النسخة" style="width:240px">
    <select id="verType" style="width:160px">${selOpts([['initial', 'جدول أولي'], ['edited', 'جدول معدل'], ['final', 'جدول نهائي'], ['backup', 'نسخة احتياطية']], 'edited')}</select>
    <button class="btn pri" data-act="saveVer">💾 حفظ نسخة</button></div></div>
  <div class="card"><h3>النسخ المحفوظة (${vs.length})</h3><div class="scroll">${tbl(['الاسم', 'النوع', 'التاريخ', 'مقارنة', 'إجراءات'], vs.map(v => [esc(v.name), kind[v.type] || v.type, fmtDate(v.time),
    `<label><input type="radio" name="ca" ${UI.cmpA === v.id ? 'checked' : ''} data-chg="cmpA" value="${v.id}"> أ</label> <label><input type="radio" name="cb" ${UI.cmpB === v.id ? 'checked' : ''} data-chg="cmpB" value="${v.id}"> ب</label>`,
    `<div class="row noprint"><button class="btn sm" data-act="restoreVer" data-id="${v.id}">استعادة</button><button class="btn sm danger" data-act="delVer" data-id="${v.id}">حذف</button></div>`]))}</div>
    ${cmp}</div>
  <div class="card"><h3>النسخة الاحتياطية (JSON)</h3><div class="row"><button class="btn pri" data-act="exportJson">⬇️ تصدير نسخة احتياطية</button>
    <label class="btn">⬆️ استعادة من ملف<input type="file" accept=".json,application/json" data-chg="importJson" hidden></label>
    <button class="btn danger" data-act="resetAll">إعادة ضبط البرنامج بالكامل</button></div>
    <p class="muted">البيانات تُحفظ تلقائياً في هذا المتصفح. صدّر نسخة احتياطية بشكل دوري، خصوصاً قبل مسح بيانات المتصفح أو تغيير الجهاز.</p></div>
  <div class="card"><h3>سلة المحذوفات (${S.trash.length})</h3>${S.trash.map(t => `<div class="row sp msg i"><span>${t.type === 'class' ? 'شعبة' : 'معلم'}: ${esc(t.name)} — ${fmtDate(t.time)}</span><button class="btn sm" data-act="restoreTrash" data-id="${t.id}">استرجاع</button></div>`).join('') || '<p class="muted">السلة فارغة.</p>'}</div>`;
};
function compareVersions(a, b) {
  const va = getVersions().find(x => x.id === a), vb = getVersions().find(x => x.id === b); if (!va || !vb) return '';
  const A = JSON.parse(va.data), B = JSON.parse(vb.data);
  const nm = (St, l) => { const c = St.classes.find(x => x.id === l.classId), s = St.subjects.find(x => x.id === l.subjectId); return (s ? s.name : '?') + ' – ' + (c ? c.name : '?'); };
  const key = l => l.id; const mb = new Map(B.lessons.map(l => [key(l), l]));
  const pos = l => l && l.day != null ? DAYS_ALL[l.day] + ' ' + l.period : 'غير موزعة';
  const rows = [];
  A.lessons.forEach(l => { const o = mb.get(key(l)); if (o && (o.day !== l.day || o.period !== l.period)) rows.push([esc(nm(A, l)), pos(l), pos(o)]); });
  return `<h4>الفروق بين «${esc(va.name)}» (أ) و«${esc(vb.name)}» (ب): ${rows.length} حصة تغيّر موضعها</h4>${tbl(['الحصة', 'في أ', 'في ب'], rows.slice(0, 200))}`;
}
CHG.cmpA = el => { UI.cmpA = el.value; render(); };
CHG.cmpB = el => { UI.cmpB = el.value; render(); };
ACT.saveVer = () => {

};
ACT.restoreVer = async el => {
  const v = getVersions().find(x => x.id === el.dataset.id);
  if (!(await ask(`استعادة «${esc(v.name)}» ستستبدل بيانات البرنامج الحالية (تؤخذ نسخة تلقائية قبلها). متابعة؟`, { yes: 'استعادة' }))) return;
  autoBackup('استعادة نسخة'); S = Object.assign(newState(), JSON.parse(v.data)); reindex(); commit('استعادة النسخة: ' + v.name); toast('تمت الاستعادة');
};
ACT.delVer = async el => {
  if (!(await ask('حذف هذه النسخة نهائياً؟', { danger: true }))) return;
  putVersions(getVersions().filter(v => v.id !== el.dataset.id)); render();
};
ACT.exportJson = () => {
  download('نسخة-احتياطية-جدول-الحصص-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json', JSON.stringify({ app: 'schoolTT', v: 1, state: S }, null, 1));
  logChange('تصدير نسخة احتياطية JSON'); save();
};
CHG.importJson = async el => {
  const f = el.files[0]; if (!f) return;
  try {
    const j = JSON.parse((await f.text()).replace(/^\ufeff/, '')); const st = j.state || j;
    if (!st.school || !Array.isArray(st.lessons)) throw new Error('الملف ليس نسخة احتياطية صالحة');
    if (!(await ask('سيتم استبدال كل البيانات الحالية بمحتوى الملف (تؤخذ نسخة تلقائية قبلها). متابعة؟', { yes: 'استعادة' }))) return;
    autoBackup('استعادة من ملف'); S = Object.assign(newState(), st); reindex(); commit('استعادة نسخة احتياطية من ملف'); toast('✅ تمت الاستعادة');
  } catch (e) { toast('تعذر قراءة الملف: ' + e.message, 'err'); }
};
ACT.restoreTrash = el => { if (restoreTrash(el.dataset.id)) commit('استرجاع من سلة المحذوفات'); };
ACT.resetAll = async () => {
  if (!(await ask('سيتم مسح كل البيانات والبدء من جديد. تؤخذ نسخة تلقائية قبل ذلك. متأكد؟', { danger: true, yes: 'مسح الكل' }))) return;

/* ---------- سجل التغييرات ---------- */
PAGES.log = () => `<div class="card"><div class="scroll">${tbl(['الوقت', 'المستخدم', 'التغيير', 'القيمة القديمة', 'القيمة الجديدة'],

<script>
'use strict';
/* app.js — نقطة البداية */
function boot() {
  let hadData = false; try { hadData = !!localStorage.getItem(STORE_KEY); } catch (e) { /* لا شيء */ }
  licInit(hadData);
  /* منع الميزات المخفية في التجربة حتى لو استُدعيت برمجياً */
  [['printNow', 'p'], ['exportPdf', 'p'], ['exportXls', 'p'], ['exportJson', 'b'], ['approve', 'p']].forEach(([k]) => { const f = ACT[k]; ACT[k] = (el, e) => featureBlocked(k) ? undefined : f(el, e); });
  { const f = CHG.importJson; CHG.importJson = (el, e) => featureBlocked('importJson') ? undefined : f(el, e); }
  const had = loadState();
  if (!had || !S.classes.length && !S.teachers.length && !S.log.length) {
    S = newState(); seedDefaults(); logChange('إنشاء البيانات الافتراضية عند أول تشغيل'); save();
    setTimeout(() => toast('✅ أُنشئت الصفوف الستة ومواد كل صف تلقائياً. أضف المعلمين ثم اختر معلماً لكل مادة.', 'ok'), 400);
  }
  reindex(); pageStyle(); render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* اختياري */ }
}
document.addEventListener('DOMContentLoaded', boot);

</script>
