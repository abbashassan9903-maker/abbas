<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج جدول توزيع الحصص المدرسي</title>
<style>
:root{
  --ink:#16283b;--ink2:#41566b;--mute:#7a8a99;--line:#d9e1e8;--bg:#eef2f5;--card:#fff;
  --pri:#1d6b78;--pri-d:#14515b;--pri-l:#dcecef;--acc:#c98a2b;--ok:#2f7d4f;--warn:#b9731a;--err:#b3372f;
  --side:#17324d;--side2:#21425f;--r:10px;
  --font:"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.3}
small{color:var(--mute)}
.muted{color:var(--mute)}
#app{display:flex;min-height:100vh}
#side{width:240px;background:var(--side);color:#dbe7f2;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:18px 16px 14px;border-bottom:1px solid #ffffff22}
.brand b{display:block;font-size:17px;color:#fff}
.brand span{font-size:12px;color:#9fb6cb}
#side nav{padding:8px}
.nav{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;text-align:start;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:14.5px}
.nav:hover{background:var(--side2)}
.nav.on{background:var(--pri);color:#fff}
.nav i{font-style:normal;width:22px;text-align:center}
.sidefoot{margin-top:auto;padding:12px 16px;font-size:12px;color:#9fb6cb;border-top:1px solid #ffffff22}
#content{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:12px;padding:10px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
#top h1{font-size:19px;margin:0;flex:1}
#menuBtn{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--pri-l);font-size:13px}
.chip.err{background:#f7dcda;color:var(--err)}.chip.ok{background:#d9eee2;color:var(--ok)}.chip.warn{background:#f8e7cc;color:var(--warn)}
#main{padding:22px;max-width:1500px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px}
.card h3{font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--pri-d)}
.stat span{font-size:13px;color:var(--ink2)}
.stat.err b{color:var(--err)}.stat.ok b{color:var(--ok)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:14px}
.btn:hover{background:var(--pri-l)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.danger{color:var(--err);border-color:#e3b9b6}
.btn.danger:hover{background:#f7dcda}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13.5px;color:var(--ink2)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{padding:7px 9px;border:1px solid #c2cdd7;border-radius:6px;background:#fff;min-width:0;width:100%}
input[type=color]{width:46px;height:34px;padding:2px;border:1px solid #c2cdd7;border-radius:6px;background:#fff}
input:focus,select:focus,textarea:focus,.btn:focus-visible,.nav:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.checks{display:flex;gap:10px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff}
table.dt{width:100%;border-collapse:collapse;background:#fff}
table.dt th,table.dt td{border:1px solid var(--line);padding:7px 9px;text-align:start;font-size:14px;vertical-align:middle}
table.dt th{background:#f1f5f8;color:var(--ink2);font-weight:600}
table.dt tr:hover td{background:#fafcfd}
.scroll{overflow:auto;max-width:100%}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:6px}
.num{display:inline-flex;align-items:center;border:1px solid #c2cdd7;border-radius:6px;overflow:hidden;background:#fff}
.num button{border:0;background:#f1f5f8;width:30px;height:30px;cursor:pointer;font-size:16px}
.num button:hover{background:var(--pri-l)}
.num input{width:46px;text-align:center;border:0;border-radius:0;padding:4px}
.msg{padding:9px 12px;border-radius:7px;margin:6px 0;font-size:14px;border-inline-start:4px solid}
.msg.c{background:#fbeceb;border-color:var(--err)}
.msg.w{background:#fcf3e2;border-color:var(--warn)}
.msg.i{background:#e6f1f3;border-color:var(--pri)}
.msg.o{background:#e5f3ea;border-color:var(--ok)}
.msg small{display:block;margin-top:2px}
.empty-state{text-align:center;padding:30px 10px;color:var(--ink2)}
/* ---------- جداول الحصص ---------- */
table.tt{border-collapse:separate;border-spacing:3px;width:100%;min-width:640px}
table.tt th{background:var(--side);color:#fff;padding:6px 4px;border-radius:5px;font-size:13.5px;font-weight:600}
table.tt th small{display:block;color:#b7cbdd;font-weight:400;font-size:11px}
table.tt td{height:62px;min-width:86px;border-radius:5px;padding:2px;vertical-align:top;background:#fff;border:1px solid var(--line)}
table.tt td.empty{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#f4f7f9 6px,#f4f7f9 12px);cursor:pointer}
table.tt td.empty:hover{background:var(--pri-l)}
table.tt td.empty.off{background:repeating-linear-gradient(135deg,#f9e3e1,#f9e3e1 6px,#fff 6px,#fff 12px)}
table.tt td.na{background:#e8edf1;color:#9aa8b5;text-align:center;vertical-align:middle}
table.tt td.hit{outline:3px solid var(--acc);outline-offset:-3px}
.les{height:100%;min-height:56px;padding:4px 6px;border-radius:4px;border-inline-start:5px solid;cursor:grab;position:relative;display:flex;flex-direction:column;justify-content:center}
.les strong{font-size:13.5px}
.les small{font-size:11.5px;color:var(--ink2)}
.les.bad{outline:2px solid var(--err)}
.les.picked{outline:3px solid var(--acc);box-shadow:0 0 0 3px #c98a2b44}
.les .lk{position:absolute;inset-block-start:1px;inset-inline-end:2px;font-size:11px}
.gl{display:flex;flex-direction:column;line-height:1.2;padding:2px 4px}
.gl strong{font-size:12.5px}.gl small{font-size:11px}
table.gen td{height:46px;min-width:70px}
.pool{display:flex;gap:8px;flex-wrap:wrap}
.pool .les{width:150px;min-height:48px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.selbar{position:sticky;bottom:10px;background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;z-index:10}
.selbar .btn{background:#ffffff18;color:#fff;border-color:#ffffff40}
.selbar .btn:hover{background:#ffffff30}
table.all{min-width:0;width:max-content}
table.all td{min-width:62px;height:44px}
table.all th.cn{position:sticky;inset-inline-start:0;z-index:3;min-width:84px}
table.all th.dh{font-size:14px}
table.all th.ph{padding:3px 2px;font-size:12px}
table.all td.ds,table.all th.ds{border-inline-start:4px solid var(--ink)}
table.all .gl strong{font-size:11.5px}table.all .gl small{font-size:10px}
.gscroll{max-height:75vh}
/* ---------- نوافذ وإشعارات ---------- */
#modalRoot{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:#0b1a2a99;z-index:100;overflow:auto;padding:30px 12px}
#modalRoot.on{display:flex}
.modal{background:#fff;border-radius:12px;width:min(760px,100%);box-shadow:0 20px 60px #0006}
.modal.wide{width:min(980px,100%)}
.modal>header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal>header h3{margin:0}
.modal .mb{padding:18px;max-height:68vh;overflow:auto}
.modal>footer{display:flex;gap:10px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);background:#f7f9fb;border-radius:0 0 12px 12px}
#toasts{position:fixed;inset-block-end:18px;inset-inline-start:18px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px #0004;max-width:360px;animation:tin .18s ease-out}
.toast.err{background:var(--err)}.toast.warn{background:var(--warn)}.toast.ok{background:var(--ok)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #fff7;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* ---------- التقارير والطباعة ---------- */
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px}
.rh{display:flex;align-items:center;gap:14px;border-bottom:3px double var(--ink);padding-bottom:10px;margin-bottom:12px}
.rh-logo{width:72px;text-align:center;font-size:44px}.rh-logo img{max-width:70px;max-height:70px}
.rh-mid{flex:1;text-align:center}.rh-mid h2{margin:0}.rh-mid h3{margin:4px 0;color:var(--pri-d)}.rh-mid p{margin:0;font-size:13px}
.rh-date{width:90px;font-size:12px;text-align:center}
.rf{display:flex;justify-content:space-between;margin-top:14px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.sheet h4{margin:16px 0 6px}
.big{font-size:20px}
@media print{
  body{background:#fff;font-size:12px}
  #side,#top,.noprint,.selbar,#toasts{display:none!important}
  #main{padding:0;max-width:none}
  .card{border:0;padding:0;margin:0}
  .sheet{border:0;padding:0;margin:0;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto}
  table.tt td{height:auto;min-height:40px}
  table.tt{min-width:0}
  table.all th.cn{position:static}
  .gscroll{max-height:none;overflow:visible}
  table.all{width:100%}
  table.all td{min-width:0;height:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:860px){
  #side{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transform:translateX(100%);transition:transform .2s;box-shadow:0 0 30px #0007}
  #side.open{transform:none}
  #menuBtn{display:inline-flex}
  #main{padding:12px}
  #top{padding:8px 12px}
  .stats{grid-template-columns:repeat(2,1fr)}
}

</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>جدول توزيع الحصص المدرسي</b><span>مدرسة التقدم الابتدائية للبنين</span></div>
    <nav></nav>
    <div class="sidefoot">إعداد الأستاذ عباس حسن علي<br>مدير مدرسة التقدم الابتدائية للبنين<br>قسم تربية آمرلي</div>
  </aside>
  <div id="content"><header id="top"></header><main id="main"></main></div>
</div>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   data.js — النماذج والبيانات الافتراضية والتخزين المحلي
   المستويات الثلاثة:
   SubjectDefinition  = S.subjects      (تعريف المادة)
   ClassSubjectAssignment = S.assign    (ربط المادة بالشعبة + العدد + المعلم)
   LessonInstance     = S.lessons       (الحصة الفعلية داخل الجدول)
   ===================================================================== */

const DAYS_ALL = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const GRADE_NAMES = ['الأول', 'الثاني', 'الثالث', 'الرابع', 'الخامس', 'السادس'];
const SECTIONS = ['أ', 'ب', 'ج', 'د', 'هـ', 'و', 'ز', 'ح'];
const SPECIALTIES = ['معلم صف (عام)', 'لغة عربية', 'تربية إسلامية', 'رياضيات', 'علوم', 'لغة إنكليزية',
  'اجتماعيات', 'تربية فنية', 'تربية رياضية', 'لغة تركمانية', 'حاسوب'];
const GENERAL_SPEC = 'معلم صف (عام)';
const PALETTE = ['#d9534f', '#2e8b8b', '#e08e2b', '#4a7bd0', '#7b5ea7', '#3d9a5f', '#c2548c', '#8a8f3a',
  '#b5651d', '#2b6f9e', '#6c757d', '#a0522d', '#1f8a70', '#9b59b6'];
const EMPLOYMENT = ['ملاك دائم', 'عقد', 'محاضر مجاني', 'تعيين مركزي', 'منقول'];

const BASE_SUBJECTS = {
  'القراءة': { code: 'قر', color: '#d9534f', spec: 'لغة عربية', heavy: true },
  'العربية': { code: 'عر', color: '#c0392b', spec: 'لغة عربية', heavy: true },
  'الإسلامية': { code: 'إس', color: '#3d9a5f', spec: 'تربية إسلامية' },
  'الأخلاقية': { code: 'أخ', color: '#8a8f3a', spec: 'تربية إسلامية' },
  'الرياضيات': { code: 'رض', color: '#4a7bd0', spec: 'رياضيات', heavy: true },
  'العلوم': { code: 'عل', color: '#2e8b8b', spec: 'علوم', heavy: true },
  'التركمانية': { code: 'تر', color: '#7b5ea7', spec: 'لغة تركمانية' },
  'الفنية': { code: 'فن', color: '#c2548c', spec: 'تربية فنية' },
  'الرياضة': { code: 'ري', color: '#e08e2b', spec: 'تربية رياضية' },
  'الإنكليزية': { code: 'إن', color: '#2b6f9e', spec: 'لغة إنكليزية', heavy: true },
  'الاجتماعيات': { code: 'اج', color: '#a0522d', spec: 'اجتماعيات' },
  'القرآن الكريم': { code: 'قق', color: '#1f8a70', spec: 'تربية إسلامية' },
  'الحاسوب': { code: 'حا', color: '#6c757d', spec: 'حاسوب' }
};

const GRADE_TEMPLATES = {
  1: [['القراءة', 9], ['الإسلامية', 2], ['الأخلاقية', 2], ['الرياضيات', 6], ['العلوم', 4], ['التركمانية', 2], ['الفنية', 2], ['الرياضة', 2], ['الإنكليزية', 3]],
  2: [['القراءة', 8], ['الإسلامية', 3], ['الأخلاقية', 2], ['الرياضيات', 6], ['العلوم', 4], ['التركمانية', 2], ['الفنية', 2], ['الرياضة', 2], ['الإنكليزية', 3]],
  3: [['القراءة', 9], ['الإسلامية', 3], ['الرياضيات', 6], ['العلوم', 4], ['التركمانية', 2], ['الفنية', 2], ['الرياضة', 3], ['الإنكليزية', 3]],
  4: [['العربية', 8], ['الإسلامية', 3], ['الرياضيات', 6], ['العلوم', 4], ['التركمانية', 2], ['الفنية', 2], ['الرياضة', 2], ['الإنكليزية', 3], ['الاجتماعيات', 2]],
  5: [['العربية', 6], ['الإسلامية', 3], ['الرياضيات', 6], ['العلوم', 4], ['التركمانية', 2], ['الفنية', 2], ['الرياضة', 2], ['الإنكليزية', 4], ['الاجتماعيات', 3]],
  6: [['العربية', 6], ['الإسلامية', 3], ['الرياضيات', 6], ['العلوم', 4], ['التركمانية', 2], ['الفنية', 2], ['الرياضة', 2], ['الإنكليزية', 5], ['الاجتماعيات', 3]]
};

const STORE_KEY = 'schoolTT.state.v1';
const VER_KEY = 'schoolTT.versions.v1';

const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const rnd = n => Math.floor(Math.random() * n);

let S = null;
let REV = 0;
let IDX = { t: new Map(), c: new Map(), s: new Map(), a: new Map(), l: new Map() };

function reindex() {
  IDX = {
    t: new Map(S.teachers.map(x => [x.id, x])),
    c: new Map(S.classes.map(x => [x.id, x])),
    s: new Map(S.subjects.map(x => [x.id, x])),
    a: new Map(S.assign.map(x => [x.id, x])),
    l: new Map(S.lessons.map(x => [x.id, x]))
  };
}
const getT = id => IDX.t.get(id);
const getC = id => IDX.c.get(id);
const getSub = id => IDX.s.get(id);
const getA = id => IDX.a.get(id);
const getL = id => IDX.l.get(id);

/* ---------- الحالة الابتدائية ---------- */
function defaultSchool() {
  return {
    name: 'مدرسة التقدم الابتدائية للبنين', directorate: '', section: 'قسم تربية آمرلي', governorate: '',
    year: '2026 - 2027', stage: 'الابتدائية', days: 5, periods: 7, duration: 45, start: '08:00',
    breakAfter: 3, breakMin: 20, durs: [45, 45, 45, 45, 45, 45, 45], breaks: [0, 0, 20, 0, 0, 0, 0], director: 'الأستاذ عباس حسن علي',
    author: 'إعداد الأستاذ عباس حسن علي', logo: ''
  };
}

/* يضمن وجود مدة لكل حصة واستراحة بعد كل حصة (0 = بلا استراحة)، ويرحّل الإعدادات القديمة */
function normalizeSchool() {
  const sc = S.school, n = +sc.periods || 7;
  if (!Array.isArray(sc.durs)) sc.durs = [];
  if (!Array.isArray(sc.breaks)) {
    sc.breaks = []; for (let i = 1; i <= n; i++) sc.breaks.push(i === +sc.breakAfter && i < n ? +sc.breakMin || 0 : 0);
  }
  for (let i = 0; i < n; i++) { sc.durs[i] = +sc.durs[i] > 0 ? +sc.durs[i] : (+sc.duration || 45); sc.breaks[i] = +sc.breaks[i] > 0 ? +sc.breaks[i] : 0; }
  sc.durs.length = n; sc.breaks.length = n; sc.breaks[n - 1] = 0;
}

function newState() {
  return {
    v: 1, school: defaultSchool(), subjects: [], classes: [], assign: [], teachers: [], lessons: [],
    absences: [], log: [], trash: [], locks: { full: false },
    settings: { maxConsec: 3, paper: 'A4', orient: 'landscape' }
  };
}

function seedDefaults() {
  S.subjects = []; S.classes = []; S.assign = []; S.lessons = [];
  for (let g = 1; g <= 6; g++) createClass(g, 'أ');
  reindex();
}

/* ---------- التخزين ---------- */
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); return true; }
  catch (e) { if (typeof toast === 'function') toast('تعذر الحفظ التلقائي — صدّر نسخة احتياطية الآن', 'err'); return false; }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { S = Object.assign(newState(), JSON.parse(raw)); normalizeSchool(); S.settings = Object.assign(newState().settings, S.settings); S.locks = S.locks || { full: false }; reindex(); return true; }
  } catch (e) { console.error(e); }
  S = newState(); reindex(); return false;
}

function logChange(text, oldV, newV) {
  S.log.unshift({ id: uid(), time: Date.now(), user: S.school.director || 'مدير المدرسة', text, oldV: oldV ?? '', newV: newV ?? '' });
  if (S.log.length > 600) S.log.length = 600;
}

/* ---------- النسخ ---------- */
function getVersions() { try { return JSON.parse(localStorage.getItem(VER_KEY) || '[]'); } catch (e) { return []; } }
function putVersions(v) { try { localStorage.setItem(VER_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } }
function saveVersion(name, type = 'manual') {
  let v = getVersions();

      id: uid(), name, code: b.code || name.slice(0, 2), color: b.color || PALETTE[S.subjects.length % PALETTE.length],

/* ---------- الصفوف والشعب ---------- */

function nextSection(grade) {

  return SECTIONS.find(x => !used.includes(x)) || String(used.length + 1);
}

function createClass(grade, sec, customName, tpl) {
  const c = {
    id: uid(), grade, sec, name: customName || ((GRADE_NAMES[grade - 1] || 'صف ' + grade) + ' ' + sec),
    tpl: tpl || grade, periods: S.school.periods, noLast: false, noRepeat: true, offDays: [], forbid: [], locked: false

function addAssign(cls, subjectId, count, teacherId = null) {
  const a = { id: uid(), classId: cls.id, subjectId, count, teacherId, forbidP: [], locked: false };
  S.assign.push(a); reindex(); syncLessons(a); return a;

/* مزامنة الحصص الفعلية مع عدد الحصص المطلوب. عند الإنقاص تُحذف أولاً غير الموزعة ثم غير المثبتة.

  const ls = S.lessons.filter(l => l.asgId === a.id);
  let diff = a.count - ls.length;
  while (diff > 0) {
    S.lessons.push({ id: uid(), asgId: a.id, classId: a.classId, subjectId: a.subjectId, teacherId: a.teacherId, day: null, period: null, locked: false });
    diff--;
  }
  if (diff < 0) {
    let need = -diff;
    const cand = [...ls.filter(l => l.day == null), ...ls.filter(l => l.day != null && !isLocked(l))];
    const rm = cand.slice(0, need); need -= rm.length;
    if (need > 0) {
      const lockedOnes = ls.filter(l => l.day != null && isLocked(l)).slice(0, need);
      if (!force) return { blocked: lockedOnes };
      rm.push(...lockedOnes);
    }
    const rmSet = new Set(rm);
    S.lessons = S.lessons.filter(l => !rmSet.has(l));

  return { ok: true };
}

  for (const a of S.assign.filter(x => x.classId === from.id)) {
    const n = addAssign(to, a.subjectId, a.count, a.teacherId);
    n.forbidP = (a.forbidP || []).slice();
  }
}

}

function newTeacher(name) {

    id: uid(), name, birth: '', jobTitle: 'معلم', specialty: GENERAL_SPEC, degree: '', hireDate: '', startDate: '',
    staff: '', schoolOrigin: S.school.name, employment: EMPLOYMENT[0], color: PALETTE[S.teachers.length % PALETTE.length],
    quota: 24, offDays: [], unavail: {}, noFirst: false, noLast: false, avoidFirst: false, avoidLast: false,

  S.assign.forEach(a => { if (a.teacherId === t.id) a.teacherId = null; });
  S.lessons.forEach(l => { if (l.teacherId === t.id) l.teacherId = null; });

  if (it.type === 'class') {

  } else if (it.type === 'teacher') {

  }

  if (!t || !sub) return true;

}

/* ---------- أوقات الحصص ---------- */
function periodTimes() {

  const fmt = x => String(Math.floor(x / 60) % 24).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
  for (let p = 1; p <= sc.periods; p++) {

const nd = () => +S.school.days;
const np = () => +S.school.periods;
const clsPeriods = c => Math.min(+c.periods || np(), np());

/* ---------- القيود الإلزامية ---------- */
function teacherOK(t, d, p) {
  if (!t) return true;
  if ((t.offDays || []).includes(d)) return false;
  if (t.unavail && t.unavail[d] && t.unavail[d].includes(p)) return false;
  if (t.noFirst && p === 1) return false;
  if (t.noLast && p === np()) return false;
  return true;
}

function subjectOK(a, c, p) {
  const s = getSub(a.subjectId); const cp = clsPeriods(c);
  if (s) {
    if (s.noLastN && p > cp - s.noLastN) return false;
    if ((s.forbidP || []).includes(p)) return false;
  }
  if ((a.forbidP || []).includes(p)) return false;
  if ((c.forbid || []).some(f => f.subjectId === a.subjectId && +f.period === p)) return false;
  return true;
}

/* هل الموضع مسموح من حيث القيود الثابتة فقط (بغض النظر عن الإشغال)؟ يعيد سبب الرفض أو '' */
function staticReason(l, d, p) {

  if (d >= nd() || p > np()) return 'خارج أيام أو فترات الدوام';
  if (clsDayOff(c, d)) return 'يوم غير مفعّل للشعبة';
  if (p > clsPeriods(c)) return 'خارج عدد حصص الشعبة اليومي';
  if (c.noLast && p === clsPeriods(c)) return 'الحصة الأخيرة غير مسموحة للشعبة';
  if (!subjectOK(a, c, p)) return 'قيد خاص بالمادة في هذه الحصة';
  const t = getT(l.teacherId);
  if (t) {
    if ((t.offDays || []).includes(d)) return 'يوم راحة المعلم ' + t.name;
    if (t.unavail && t.unavail[d] && t.unavail[d].includes(p)) return 'المعلم ' + t.name + ' غير متاح في هذه الحصة';
    if (t.noFirst && p === 1) return 'المعلم ' + t.name + ' لا يعمل الحصة الأولى';
    if (t.noLast && p === np()) return 'المعلم ' + t.name + ' لا يعمل الحصة الأخيرة';

/* عدد الأيام الفعلية المتاحة للمادة: أيام الشعبة التي لا يكون فيها المعلم في راحة */
function activeDaysFor(a) {
  const c = getC(a.classId), t = getT(a.teacherId); let n = 0;
  for (let d = 0; d < nd(); d++) if (!clsDayOff(c, d) && !(t && (t.offDays || []).includes(d))) n++;
  return Math.max(1, n);
}
function maxPerDay(a) {
  const s = getSub(a.subjectId);
  return Math.max((s && s.maxPerDay) || 1, Math.ceil(a.count / activeDaysFor(a)));
}

function isLocked(l) {
  if (l.day == null) return false;
  if (S.locks.full || l.locked) return true;
  const a = getA(l.asgId), t = getT(l.teacherId), c = getC(l.classId);
  return !!((c && c.locked) || (a && a.locked) || (t && (t.locked || (t.lockedDays || []).includes(l.day))));

/* ---------- الإشغال ---------- */
const kC = (id, d, p) => id + '|' + d + '|' + p;
const kS = (c, s, d) => c + '|' + s + '|' + d;

  l.day = d; l.period = p;

  if (l.teacherId) {
    o.te.set(kC(l.teacherId, d, p), l);
    if (p === 1) o.f.set(l.teacherId, (o.f.get(l.teacherId) || 0) + 1);
    if (p === clsPeriods(getC(l.classId))) o.la.set(l.teacherId, (o.la.get(l.teacherId) || 0) + 1);
  }
  const k = kS(l.classId, l.subjectId, d); o.cs.set(k, (o.cs.get(k) || 0) + 1);

  const d = l.day, p = l.period;

  if (l.teacherId) {
    o.te.delete(kC(l.teacherId, d, p));
    if (p === 1) o.f.set(l.teacherId, (o.f.get(l.teacherId) || 1) - 1);
    if (p === clsPeriods(getC(l.classId))) o.la.set(l.teacherId, (o.la.get(l.teacherId) || 1) - 1);
  }
  const k = kS(l.classId, l.subjectId, d); o.cs.set(k, (o.cs.get(k) || 1) - 1);

function isFree(o, l, d, p, sm) {
  if (sm ? !sm.get(l.id).has(d * 10 + p) : staticReason(l, d, p)) return false;
  if (o.cl.has(kC(l.classId, d, p))) return false;
  if (l.teacherId && o.te.has(kC(l.teacherId, d, p))) return false;

  const o = mkOcc();
  S.lessons.forEach(l => { if (l.day != null) put(o, l, l.day, l.period); });
  return o;
}

/* ---------- التكلفة التقريبية أثناء التوزيع ---------- */
function softCost(o, l, d, p) {
  const t = getT(l.teacherId), c = getC(l.classId), s = getSub(l.subjectId);
  let cost = Math.random() * 1.5;
  const cp = clsPeriods(c);
  cost += (p - 1) * 0.7;
  if (p > 1 && !o.cl.has(kC(c.id, d, p - 1))) cost += 3;
  cost += (o.cs.get(kS(c.id, s.id, d)) || 0) * 7;
  if (s.heavy && p > 4) cost += (p - 4) * 1.2;
  const nb = q => { const x = o.cl.get(kC(c.id, d, q)); return x && x.subjectId === s.id; };
  if (nb(p - 1) || nb(p + 1)) cost += 3;
  if (t) {
    const day = []; for (let q = 1; q <= np(); q++) if (o.te.has(kC(t.id, d, q))) day.push(q);
    const maxC = t.maxConsec || S.settings.maxConsec;
    if (day.length) {
      let mind = 99; day.forEach(q => { mind = Math.min(mind, Math.abs(q - p)); });
      if (mind > 1) cost += (mind - 1) * 3; else cost -= 1.5;
    }
    let run = 1; for (let q = p - 1; day.includes(q); q--) run++; for (let q = p + 1; day.includes(q); q++) run++;
    if (run > maxC) cost += 8 * (run - maxC);
    if (t.noConsec && run > 1) cost += 6;
    if (t.avoidFirst && p === 1) cost += 5;
    if (t.avoidLast && p === cp) cost += 5;
    cost += day.length * 2.2 * (t.spread ? 1.5 : 1);
    if (t.prefOff === d) cost += 8;
    if (p === 1) cost += (o.f.get(t.id) || 0) * 2;
    if (p === cp) cost += (o.la.get(t.id) || 0) * 2;
  }

}

function placeBest(o, l, sm) {
  let best = null, bc = Infinity;
  for (let d = 0; d < nd(); d++) for (let p = 1; p <= np(); p++) {
    if (!isFree(o, l, d, p, sm)) continue;
    const c = softCost(o, l, d, p);
    if (c < bc) { bc = c; best = [d, p]; }
  }
  if (!best) return false;
  put(o, l, best[0], best[1]); return true;
}

/* إزاحة: ضع الحصة مكان حصة (أو حصتين) غير مقفلة ثم أعد توزيعها في مكان آخر */
function eject(o, l, sm, fixedSet, depth = 1) {
  const slots = [...sm.get(l.id)].sort(() => Math.random() - 0.5).slice(0, 45);
  for (const code of slots) {
    const d = Math.floor(code / 10), p = code % 10;
    const bc = o.cl.get(kC(l.classId, d, p));
    const bt = l.teacherId && o.te.get(kC(l.teacherId, d, p));
    const blockers = [...new Set([bc, bt].filter(Boolean))];
    if (!blockers.length || blockers.some(b => fixedSet.has(b))) continue;
    const orig = blockers.map(b => [b, b.day, b.period]);
    blockers.forEach(b => take(o, b));
    if (!isFree(o, l, d, p, sm)) { orig.forEach(([b, bd, bp]) => put(o, b, bd, bp)); continue; }
    put(o, l, d, p);

    for (const b of blockers) { if (!placeBest(o, b, sm) && !(depth > 0 && eject(o, b, sm, fixedSet, depth - 1))) { ok = false; break; } }
    if (ok) return true;
    blockers.forEach(b => { if (b.day != null) take(o, b); });

    orig.forEach(([b, bd, bp]) => put(o, b, bd, bp));

/* ---------- التحليل والقياس ---------- */
function stdev(arr) { if (arr.length < 2) return 0; const m = arr.reduce((a, b) => a + b, 0) / arr.length; return Math.sqrt(arr.reduce((a, b) => a + (b - m) * (b - m), 0) / arr.length); }

      const kd = l.teacherId + '|' + l.day; if (!tday.has(kd)) tday.set(kd, []); tday.get(kd).push(l.period);
      const cc = getC(l.classId); if (cc && l.period === clsPeriods(cc)) lastCnt.set(l.teacherId, (lastCnt.get(l.teacherId) || 0) + 1);
    }
    const kd2 = l.classId + '|' + l.day; if (!cday.has(kd2)) cday.set(kd2, []); cday.get(kd2).push(l);
    const why = staticReason(l, l.day, l.period);

    const m = { load: 0, days: 0, gaps: 0, consec: 0, first: 0, last: 0, perDay: [] };
    const maxC = t.maxConsec || S.settings.maxConsec;
    for (let d = 0; d < nd(); d++) {
      const ps = (tday.get(t.id + '|' + d) || []).slice().sort((a, b) => a - b);
      m.perDay.push(ps.length); if (!ps.length) continue;
      m.days++; m.load += ps.length;

    R.conflicts.length * 100 + R.hard.length * 100 + R.sdFirst * 4 + R.sdLast * 4;

function qualityScore(R) {
  const n = Math.max(1, S.lessons.length);
  const reasons = [];
  const pen = (pts, txt, cnt) => { if (cnt > 0) reasons.push({ pts, txt }); return pts; };
  let total = 0;
